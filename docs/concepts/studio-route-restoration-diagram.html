<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Route Restoration - Ownership Diagram</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7fb; --surface: #ffffff; --surface-2: #eef2ff;
      --ink: #172033; --muted: #65708a; --line: #ccd3e2;
      --blue: #4868e8; --blue-soft: #e9edff; --teal: #087f73;
      --teal-soft: #e0f5f1; --coral: #d35d4d; --shadow: 0 16px 40px #25335a18;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111521; --surface: #191f2e; --surface-2: #20283b;
        --ink: #edf1ff; --muted: #a8b1c7; --line: #39445d;
        --blue: #91a5ff; --blue-soft: #283354; --teal: #6ed8c7;
        --teal-soft: #183d3a; --coral: #ff9a8c; --shadow: 0 18px 44px #0000004d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.55 Inter, ui-sans-serif, system-ui, sans-serif;
    }
    main { width: min(1160px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 64px; }
    .kicker {
      color: var(--coral); font: 700 12px/1.2 ui-monospace, monospace;
      letter-spacing: .13em; text-transform: uppercase;
    }
    h1 { max-width: 760px; margin: 10px 0 8px; font-size: clamp(30px, 5vw, 54px); line-height: 1.05; }
    .lede { max-width: 760px; color: var(--muted); margin: 0 0 34px; }
    figure {
      margin: 0; padding: 28px; overflow-x: auto;
      border: 1px solid var(--line); border-radius: 18px;
      background: linear-gradient(180deg, var(--surface), var(--surface-2)); box-shadow: var(--shadow);
    }
    .stage {
      min-width: 920px; display: grid; grid-template-columns: 1fr 110px 1.3fr 110px 1fr;
      grid-template-rows: auto auto auto; gap: 22px 0; align-items: center;
    }
    .box {
      border: 1px solid var(--line); border-radius: 13px; background: var(--surface);
      padding: 18px; min-height: 126px; box-shadow: 0 8px 24px #20305a10;
    }
    .box h2 { font-size: 16px; margin: 0 0 5px; }
    .box p { color: var(--muted); margin: 0; font-size: 13px; }
    .box code { display: block; margin-top: 12px; color: var(--blue); font: 600 12px/1.45 ui-monospace, monospace; }
    .canonical {
      grid-column: 3; grid-row: 1 / span 3; min-height: 420px; padding: 24px;
      border-color: var(--blue); background: var(--blue-soft);
    }
    .canonical h2 { font-size: 20px; }
    .rule { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .rule strong { display: block; margin-bottom: 4px; }
    .route-in { grid-column: 1; grid-row: 1; }
    .local { grid-column: 1; grid-row: 3; }
    .surfaces { grid-column: 5; grid-row: 1; }
    .transient { grid-column: 5; grid-row: 3; }
    .arrow {
      position: relative; height: 2px; background: var(--line);
    }
    .arrow::after {
      content: ""; position: absolute; right: -1px; top: -4px;
      border-left: 8px solid var(--line); border-top: 5px solid transparent; border-bottom: 5px solid transparent;
    }
    .arrow.right-a { grid-column: 2; grid-row: 1; }
    .arrow.right-b { grid-column: 4; grid-row: 1; }
    .arrow.left-a { grid-column: 2; grid-row: 3; transform: rotate(180deg); }
    .arrow.left-b { grid-column: 4; grid-row: 3; transform: rotate(180deg); }
    .priority {
      grid-column: 1; grid-row: 2; color: var(--teal);
      font: 700 11px/1.4 ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase;
    }
    .quiet {
      grid-column: 5; grid-row: 2; color: var(--muted);
      font: 700 11px/1.4 ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase;
    }
    figcaption { margin-top: 18px; color: var(--muted); font-size: 13px; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .pill { border: 1px solid var(--line); border-radius: 99px; padding: 6px 10px; font: 600 11px/1 ui-monospace, monospace; }
    .pill.primary { border-color: var(--blue); color: var(--blue); }
    .pill.secondary { border-color: var(--teal); color: var(--teal); }
  </style>
</head>
<body>
<main>
  <div class="kicker">Architecture handoff pattern / Route ownership</div>
  <h1>The address bar names the active Studio surface</h1>
  <p class="lede">One canonical hash path restores public identity and selected subviews. Local storage keeps workspace preferences, never the authority to override a shared route.</p>

  <figure>
    <div class="stage">
      <section class="box route-in">
        <h2>Cold route input</h2>
        <p>Bookmark, pasted URL, reload, Back, or Forward.</p>
        <code>#/projects/acme/wiki?page=README.md</code>
      </section>
      <div class="arrow right-a" aria-hidden="true"></div>

      <section class="box canonical">
        <h2>Canonical route contract</h2>
        <p>Parse first, resolve public ids, open the surface, apply substate, then enable mirroring.</p>
        <div class="rule">
          <strong>Hash path owns identity</strong>
          <code>#/tasks/AGT-2291</code>
          <code>#/projects/acme/workbenches/lab</code>
        </div>
        <div class="rule">
          <strong>Route query owns selected subview</strong>
          <code>?page=concepts/routing.md</code>
          <code>?view=timeline:activity</code>
        </div>
        <div class="rule">
          <strong>Sibling segment owns orthogonal state</strong>
          <code>&amp;filters=type%3Abug</code>
        </div>
      </section>

      <div class="arrow right-b" aria-hidden="true"></div>
      <section class="box surfaces">
        <h2>Restored surface state</h2>
        <p>Board scope, Hub rail, Wiki page, Workbench, Task and active tabs, Epics, Settings.</p>
      </section>

      <div class="priority">Route-in wins during hydration</div>
      <div class="quiet">replaceState keeps the entry honest</div>

      <section class="box local">
        <h2>Local workspace memory</h2>
        <p>Open-tab collection, pane sizes, theme, splitter weights, collapsed groups.</p>
      </section>
      <div class="arrow left-a" aria-hidden="true"></div>
      <div class="arrow left-b" aria-hidden="true"></div>
      <section class="box transient">
        <h2>Deliberately transient</h2>
        <p>Scroll, hover, menus, dialogs, drafts, drag state, iframe runtime, polling caches.</p>
      </section>
    </div>
    <figcaption>Textual rationale and the complete per-surface route map live in <a href="studio-route-restoration.md">Studio Route Restoration</a>. This file contains only the spatial architecture view.</figcaption>
    <div class="legend">
      <span class="pill primary">public and shareable</span>
      <span class="pill secondary">local preference</span>
      <span class="pill">transient interaction</span>
    </div>
  </figure>
</main>
</body>
</html>
