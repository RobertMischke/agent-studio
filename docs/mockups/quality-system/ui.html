<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quality System &mdash; Clickable Prototype</title>
<style>
  :root {
    --base: #1e1e2e;
    --mantle: #181825;
    --crust: #11111b;
    --surface0: #313244;
    --surface1: #45475a;
    --surface2: #585b70;
    --text: #cdd6f4;
    --subtext1: #bac2de;
    --subtext0: #a6adc8;
    --overlay0: #6c7086;
    --overlay1: #7f849c;
    --mauve: #cba6f7;
    --blue: #89b4fa;
    --sky: #89dceb;
    --teal: #94e2d5;
    --green: #a6e3a1;
    --yellow: #f9e2af;
    --peach: #fab387;
    --red: #f38ba8;
    --pink: #f5c2e7;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--mantle); color: var(--text); margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; height: 100%; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; background: var(--surface0); padding: 1px 5px; border-radius: 3px; }

  /* Top bar */
  header.topbar { display: flex; align-items: center; padding: 0 18px; height: 48px; background: var(--base); border-bottom: 1px solid var(--surface0); position: sticky; top: 0; z-index: 50; }
  .brand { color: var(--mauve); font-weight: 700; margin-right: 28px; letter-spacing: 0.02em; }
  .topnav { display: flex; gap: 4px; }
  .topnav a { color: var(--subtext0); padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .topnav a:hover { color: var(--text); background: var(--surface0); text-decoration: none; }
  .topnav a.active { color: var(--text); background: var(--surface0); }
  .topnav a.new { color: var(--mauve); }
  .topbar .spacer { flex: 1; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--peach); color: var(--crust); font-weight: 600; letter-spacing: 0.05em; }

  /* Layout */
  main { padding: 24px 32px 80px; max-width: 1280px; margin: 0 auto; }
  .crumbs { font-size: 12px; color: var(--overlay1); margin-bottom: 14px; }
  .crumbs a { color: var(--overlay1); }
  .crumbs a:hover { color: var(--subtext0); }
  .crumbs .sep { margin: 0 6px; color: var(--surface2); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 13px; margin: 28px 0 10px; color: var(--subtext0); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  .lede { color: var(--subtext0); margin: 0 0 22px; max-width: 820px; }
  .note { color: var(--overlay1); font-size: 12px; }

  /* Sidebar layout */
  .with-sidebar { display: grid; grid-template-columns: 220px 1fr; gap: 22px; }
  .sidebar { background: var(--base); border: 1px solid var(--surface0); border-radius: 8px; padding: 12px; height: fit-content; position: sticky; top: 70px; }
  .sidebar .group { color: var(--overlay0); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin: 8px 8px 4px; }
  .sidebar a { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 5px; color: var(--subtext1); font-size: 13px; cursor: pointer; }
  .sidebar a:hover { background: var(--surface0); color: var(--text); text-decoration: none; }
  .sidebar a.active { background: var(--surface0); color: var(--text); }
  .sidebar a .count { color: var(--overlay0); font-size: 11px; }

  /* Filter chips */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 4px 12px; border-radius: 999px; font-size: 12px; background: var(--surface0); color: var(--subtext0); cursor: pointer; user-select: none; border: 1px solid transparent; }
  .chip:hover { color: var(--text); }
  .chip.active { background: var(--surface1); color: var(--text); border-color: var(--surface2); }
  .chip.kind-audit.active { color: var(--mauve); border-color: var(--mauve); background: rgba(203,166,247,0.10); }
  .chip.kind-check.active { color: var(--green); border-color: var(--green); background: rgba(166,227,161,0.10); }
  .chip.kind-probe.active { color: var(--sky); border-color: var(--sky); background: rgba(137,220,235,0.10); }

  /* Cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .card { background: var(--base); border: 1px solid var(--surface0); border-radius: 8px; padding: 14px; cursor: pointer; transition: border-color 0.12s, transform 0.12s; }
  .card:hover { border-color: var(--surface2); }
  .card:active { transform: translateY(1px); }
  .card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .card .id { font-family: ui-monospace, monospace; font-size: 11px; color: var(--overlay0); }
  .card .title { font-weight: 600; flex: 1; min-width: 100%; margin-top: 2px; }
  .card p { margin: 6px 0 10px; color: var(--subtext0); font-size: 13px; }
  .card .meta { display: flex; gap: 6px; flex-wrap: wrap; }

  /* Tags */
  .tag { font-size: 10.5px; padding: 2px 8px; border-radius: 4px; background: var(--surface0); color: var(--subtext0); white-space: nowrap; letter-spacing: 0.02em; }
  .tag.audit { color: var(--mauve); background: rgba(203,166,247,0.14); }
  .tag.check { color: var(--green); background: rgba(166,227,161,0.14); }
  .tag.probe { color: var(--sky); background: rgba(137,220,235,0.14); }
  .tag.scope { color: var(--blue); background: rgba(137,180,250,0.12); }
  .tag.dim { color: var(--peach); background: rgba(250,179,135,0.12); }
  .tag.sev-warn { color: var(--yellow); background: rgba(249,226,175,0.12); }
  .tag.sev-high { color: var(--red); background: rgba(243,139,168,0.12); }
  .tag.sev-info { color: var(--subtext0); background: rgba(186,194,222,0.10); }
  .tag.mode-spawn { color: var(--teal); background: rgba(148,226,213,0.12); }
  .tag.mode-inject { color: var(--pink); background: rgba(245,194,231,0.12); }

  /* Buttons */
  .btn { background: var(--surface0); color: var(--text); border: 1px solid var(--surface1); padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn:hover { background: var(--surface1); }
  .btn.primary { background: var(--mauve); color: var(--crust); border-color: var(--mauve); font-weight: 600; }
  .btn.primary:hover { background: var(--pink); border-color: var(--pink); }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row .spacer { flex: 1; }

  /* Toggles */
  .check-row { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--surface0); }
  .check-row:last-child { border-bottom: none; }
  .check-row.disabled { opacity: 0.55; }
  .toggle { width: 32px; height: 18px; background: var(--surface1); border-radius: 999px; position: relative; cursor: pointer; transition: background 0.15s; flex-shrink: 0; }
  .toggle::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--overlay0); top: 2px; left: 2px; transition: 0.15s; }
  .toggle.on { background: var(--green); }
  .toggle.on::after { left: 16px; background: var(--crust); }
  .check-row .label { font-size: 13px; }
  .check-row .label .top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .check-row .label .sub { color: var(--overlay1); font-size: 11.5px; margin-top: 3px; }
  .inherit { font-size: 10px; color: var(--overlay0); padding: 1px 6px; border: 1px dashed var(--surface1); border-radius: 3px; }

  /* Boxes */
  .box { background: var(--base); border: 1px solid var(--surface0); border-radius: 8px; }
  .box.padded { padding: 16px; }

  /* Findings */
  .finding { padding: 12px 14px; border-left: 3px solid var(--yellow); background: rgba(249,226,175,0.05); margin: 8px 0; border-radius: 0 6px 6px 0; }
  .finding.high { border-left-color: var(--red); background: rgba(243,139,168,0.06); }
  .finding.info { border-left-color: var(--blue); background: rgba(137,180,250,0.05); }
  .finding.acked { opacity: 0.5; border-left-color: var(--overlay0); background: transparent; }
  .finding .head { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
  .finding .file { font-family: ui-monospace, monospace; font-size: 12px; color: var(--blue); }
  .finding p { margin: 4px 0; font-size: 13px; color: var(--subtext1); }
  .finding .actions { margin-top: 8px; }

  /* Result chips */
  .result-strip { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
  .result-chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px; }
  .result-chip.pass { background: rgba(166,227,161,0.14); color: var(--green); }
  .result-chip.warn { background: rgba(249,226,175,0.14); color: var(--yellow); }
  .result-chip.fail { background: rgba(243,139,168,0.14); color: var(--red); }
  .result-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Probe bars */
  .bar-row { display: grid; grid-template-columns: 160px 1fr 90px; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
  .bar-track { height: 8px; background: var(--surface0); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--green); }
  .bar-fill.warn { background: var(--yellow); }
  .bar-fill.fail { background: var(--red); }
  .num { font-family: ui-monospace, monospace; color: var(--subtext1); text-align: right; }

  /* Detail layout */
  .two-pane { display: grid; grid-template-columns: 2fr 1fr; gap: 22px; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 13px; }
  .kv dt { color: var(--overlay1); }
  .kv dd { margin: 0; color: var(--text); }

  /* Radio cards (execution mode) */
  .radio-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .radio-card { background: var(--mantle); border: 1px solid var(--surface0); border-radius: 8px; padding: 12px; cursor: pointer; transition: border-color 0.12s; }
  .radio-card:hover { border-color: var(--surface2); }
  .radio-card.selected { border-color: var(--mauve); background: rgba(203,166,247,0.06); }
  .radio-card .top { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .radio-card .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--surface2); flex-shrink: 0; }
  .radio-card.selected .dot { border-color: var(--mauve); background: var(--mauve); box-shadow: inset 0 0 0 2px var(--crust); }
  .radio-card h4 { margin: 0; font-size: 14px; }
  .radio-card p { margin: 6px 0 0; color: var(--subtext0); font-size: 12.5px; }
  .radio-card .pros, .radio-card .cons { font-size: 11.5px; margin: 4px 0 0; padding-left: 14px; }
  .radio-card .pros li { color: var(--green); }
  .radio-card .cons li { color: var(--peach); }

  /* Markdown-ish block */
  .md-block { background: var(--mantle); border: 1px solid var(--surface0); border-radius: 6px; padding: 12px; font-family: ui-monospace, monospace; font-size: 12.5px; white-space: pre-wrap; color: var(--subtext1); }

  /* Project list rows */
  .project-row { padding: 14px; border-bottom: 1px solid var(--surface0); cursor: pointer; display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center; }
  .project-row:hover { background: var(--surface0); }
  .project-row .name { font-weight: 600; }
  .project-row .path { font-family: ui-monospace, monospace; font-size: 12px; color: var(--overlay1); margin-top: 2px; }
  .project-row .summary { font-size: 12px; color: var(--subtext0); }

  /* Skill row */
  .skill-row { display: grid; grid-template-columns: 1fr auto; padding: 14px; border-bottom: 1px solid var(--surface0); cursor: pointer; gap: 14px; align-items: center; }
  .skill-row:hover { background: var(--surface0); }
  .skill-row .desc { color: var(--subtext0); font-size: 13px; margin-top: 4px; }

  hr { border: none; border-top: 1px solid var(--surface0); margin: 18px 0; }

  /* Toast */
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--surface1); color: var(--text); padding: 10px 18px; border-radius: 8px; border: 1px solid var(--surface2); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100; }
  #toast.show { opacity: 1; }

  /* Empty state */
  .empty { padding: 40px; text-align: center; color: var(--overlay1); }
</style>
</head>
<body>

<header class="topbar">
  <span class="brand">Agent Task Processor</span>
  <nav class="topnav" id="topnav">
    <a data-route="#/board">Board</a>
    <a data-route="#/projects">Projects</a>
    <a data-route="#/skills">Skills</a>
    <a data-route="#/quality" class="new">Quality</a>
  </nav>
  <span class="spacer"></span>
  <span class="pill">DEV</span>
</header>

<main id="app"></main>
<div id="toast"></div>

<script>
//
// === STATE ===========================================================
//
const DIMENSIONS = ['security', 'traceability', 'performance', 'code-quality', 'architecture'];

const definitions = [
  { id:'SEC-OVERVIEW', kind:'audit', dimension:'security', scope:'project', severity:'high',
    title:'Security overview audit',
    description:'Re-checks the project security overview against the current code. Holistic, manual, long-running.',
    instructions:'Compare docs/security/overview.md and docs/security/requirements.md against the current backend and frontend code. Flag any drift, missing controls, undocumented attack surfaces.' },
  { id:'ARCH-DRIFT', kind:'audit', dimension:'architecture', scope:'project', severity:'warn',
    title:'Architecture drift',
    description:'Compares current architecture against the ADR archive. Flags decisions that have silently eroded.',
    instructions:'Walk through every ADR in docs/architecture-decisions.md. For each, check if the codebase still matches its intent. Report drifts.' },
  { id:'TRACEABILITY-COVERAGE', kind:'audit', dimension:'traceability', scope:'project', severity:'warn',
    title:'Traceability coverage',
    description:'Verifies error and slow-op instrumentation across the whole codebase.',
    instructions:'Survey the frontend and backend for global error handlers, structured logging, request timing, and long-task observability. Flag gaps.' },
  { id:'CODE-CHECK', kind:'check', dimension:'code-quality', scope:'task', severity:'warn', executionMode:'spawn',
    title:'Code review on diff',
    description:'Reviews the diff this task produced. Style, naming, dead code, missing tests.',
    instructions:'Read the diff produced by this task. Review for code quality, naming, dead code, and missing tests. Emit findings as [[CHECK_RESULT: ...]].' },
  { id:'TRACEABILITY-DIFF', kind:'check', dimension:'traceability', scope:'task', severity:'warn', executionMode:'spawn',
    title:'Traceability on diff',
    description:'Checks the diff adds error handling and timing where it touches new paths.',
    instructions:'Read the diff. For every new code path, verify: errors are caught and reported, slow operations are timed. Emit findings.' },
  { id:'SEC-DIFF', kind:'check', dimension:'security', scope:'task', severity:'high', executionMode:'spawn',
    title:'Security check on diff',
    description:'Pattern check on changed files: input validation, secret leakage, eval, path traversal.',
    instructions:'Scan the diff for security smells: input validation gaps, secret literals, eval, shell injection, path traversal.' },
  { id:'TEST-COVERAGE-DELTA', kind:'check', dimension:'code-quality', scope:'task', severity:'info', executionMode:'inject',
    title:'Test coverage delta',
    description:'Warns if new code paths land without test coverage.',
    instructions:'Before reporting [[TASK_DONE]], confirm new code paths are covered by at least one test. If not, list which.' },
  { id:'STYLE-LINT', kind:'check', dimension:'code-quality', scope:'task', severity:'info', executionMode:'inject',
    title:'Style and lint',
    description:'Cheap stylistic self-check appended to the prompt.',
    instructions:'Before finishing, re-read your own changes and ensure naming, formatting, and import order match the surrounding file.' },
  { id:'STARTUP-LATENCY', kind:'probe', dimension:'performance', scope:'runtime', severity:'warn',
    title:'App startup latency',
    description:'Cold-starts the frontend, measures time-to-interactive.',
    threshold:'2000 ms' },
  { id:'BOARD-POLL-ROUNDTRIP', kind:'probe', dimension:'performance', scope:'runtime', severity:'warn',
    title:'Grouped-jobs poll roundtrip',
    description:'Times the polled endpoint from inside the running app over 200 jobs.',
    threshold:'1000 ms' },
];

const projects = [
  { id:'agent-taskboard-dev', name:'Agent Task Processor', path:'c:\\Projects\\agent-taskboard-devspace\\agent-taskboard-dev',
    audits: ['SEC-OVERVIEW','ARCH-DRIFT','TRACEABILITY-COVERAGE'],
    taskCheckDefaults: { 'CODE-CHECK': true, 'TRACEABILITY-DIFF': true, 'SEC-DIFF': true, 'TEST-COVERAGE-DELTA': false, 'STYLE-LINT': true },
    probes: ['STARTUP-LATENCY','BOARD-POLL-ROUNDTRIP'],
    lastAudit: '2026-05-02' },
  { id:'orchestrator-target-x', name:'Orchestrator Target X', path:'c:\\Projects\\orchestrator-target-x',
    audits: ['SEC-OVERVIEW'],
    taskCheckDefaults: { 'CODE-CHECK': true, 'TRACEABILITY-DIFF': false, 'SEC-DIFF': true, 'TEST-COVERAGE-DELTA': false, 'STYLE-LINT': false },
    probes: [],
    lastAudit: 'never' },
];

const jobs = [
  { id:'refactor-job-service', title:'Refactor JobService.fetchAll polling', state:'3-progress', cli:'claude', runs:2, project:'agent-taskboard-dev',
    inheritDefaults: true,
    enabledOverrides: {},
    extra: [],
    findings: [
      { id:'f1', severity:'high', checkId:'SEC-DIFF', file:'backend/Services/JobService.cs:142', message:'User-supplied watchPath reaches Path.Combine without validation. Possible path traversal.', acked:false },
      { id:'f2', severity:'warn', checkId:'TRACEABILITY-DIFF', file:'frontend/src/app/services/job.service.ts:88', message:'New polling loop has no error-handler around the HTTP call; failures are swallowed silently.', acked:false },
      { id:'f3', severity:'warn', checkId:'TRACEABILITY-DIFF', file:'frontend/src/app/services/job.service.ts:104', message:'Long-running operation (poll cycle) does not measure duration.', acked:false },
    ],
    results: { 'CODE-CHECK': 'pass', 'TRACEABILITY-DIFF': 'warn', 'SEC-DIFF': 'fail', 'STYLE-LINT': 'pass' },
  },
  { id:'add-best-practices-section', title:'Add best-practices section to project detail', state:'2-ready', cli:'codex', runs:0, project:'agent-taskboard-dev', inheritDefaults: true, enabledOverrides:{}, extra:[], findings:[], results:{} },
];

const skills = [
  { id:'GENERATE-TASKS-FROM-FINDINGS', name:'Turn findings into tasks', when:'After an audit or task-check run', dimension:'workflow',
    description:'Reads a Quality findings list and creates a queued task per finding, scoped to the relevant file.' },
  { id:'FIND-PROJECT-WORK', name:'Project work discovery', when:'Manually from the project detail', dimension:'workflow',
    description:'Surveys repo state (open issues, recent regressions, drift) and proposes high-value tasks for the queue.' },
  { id:'REWRITE-PROMPT', name:'Rewrite task prompt', when:'On user request from a queued task', dimension:'authoring',
    description:'Improves the clarity, scope, and acceptance criteria of a queued prompt before pickup.' },
  { id:'SUMMARIZE-RUN', name:'Summarize run output', when:'After CLI run completes', dimension:'reporting',
    description:'Compresses long CLI output into a structured status digest for the protocol view.' },
  { id:'TARGET-INSTRUCTION-SYNC', name:'Sync target project instructions', when:'When onboarding a watched project', dimension:'onboarding',
    description:'Renders AGENTS.md and the agent task contract into a watched target project.' },
];

const ui = {
  libraryFilterKind: 'all',
  libraryFilterDimension: 'all',
  expandedProject: null,
};

//
// === ROUTER ==========================================================
//
function navigate(hash) {
  if (location.hash !== hash) location.hash = hash;
  else render();
}
window.addEventListener('hashchange', render);

function getRoute() {
  const hash = location.hash || '#/quality';
  const parts = hash.replace(/^#\//, '').split('/');
  return { hash, parts };
}

//
// === HELPERS =========================================================
//
const $ = (id) => document.getElementById(id);
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._h); toast._h = setTimeout(()=>t.classList.remove('show'), 1800); }
function defById(id) { return definitions.find(d => d.id === id); }
function projectById(id) { return projects.find(p => p.id === id); }
function jobById(id) { return jobs.find(j => j.id === id); }
function skillById(id) { return skills.find(s => s.id === id); }

function tagsForDef(d) {
  const kindCls = d.kind;
  const t = [`<span class="tag ${kindCls}">${esc(d.kind === 'check' ? 'Task Check' : d.kind === 'audit' ? 'Audit' : 'Probe')}</span>`];
  t.push(`<span class="tag scope">${esc(d.scope)}</span>`);
  t.push(`<span class="tag dim">${esc(d.dimension)}</span>`);
  t.push(`<span class="tag sev-${d.severity}">${esc(d.severity)}</span>`);
  if (d.executionMode) t.push(`<span class="tag mode-${d.executionMode}">mode: ${esc(d.executionMode)}</span>`);
  return t.join(' ');
}

function effectiveChecksForJob(job) {
  const project = projectById(job.project);
  const out = [];
  for (const def of definitions.filter(d => d.kind === 'check')) {
    const inheritedOn = !!project.taskCheckDefaults[def.id];
    let on = inheritedOn;
    if (job.inheritDefaults && def.id in job.enabledOverrides) on = job.enabledOverrides[def.id];
    if (job.extra.includes(def.id)) on = true;
    out.push({ def, on, inherited: inheritedOn, overridden: def.id in job.enabledOverrides });
  }
  return out;
}

function setActiveNav() {
  const { hash } = getRoute();
  document.querySelectorAll('#topnav a').forEach(a => {
    const r = a.dataset.route;
    a.classList.toggle('active', hash.startsWith(r));
  });
}

//
// === ROUTES ==========================================================
//
function render() {
  setActiveNav();
  const { parts } = getRoute();
  const root = parts[0] || 'quality';
  const app = $('app');
  app.innerHTML = '';
  if (root === '' || root === 'quality') return renderQuality(app, parts);
  if (root === 'projects') return renderProjects(app, parts);
  if (root === 'skills') return renderSkills(app, parts);
  if (root === 'jobs') return renderJob(app, parts);
  if (root === 'board') return renderBoard(app);
  app.appendChild(el(`<div class="empty">Unknown route: ${esc(parts.join('/'))}</div>`));
}

//
// --- Board (placeholder) ---
//
function renderBoard(app) {
  app.appendChild(el(`
    <div>
      <h1>Board</h1>
      <p class="lede">The kanban view of all jobs across projects. Out of scope for this prototype &mdash; jump to a sample task to see Quality wired in:</p>
      <div class="grid">
        ${jobs.map(j => `
          <div class="card" data-nav="#/jobs/${j.id}">

function renderJob(app, parts) {
  const job = jobById(parts[1]);
  if (!job) return app.appendChild(el(`<div class="empty">Job not found</div>`));
  const project = projectById(job.project);
  const eff = effectiveChecksForJob(job);
  const findings = job.findings;

  const counts = { pass: 0, warn: 0, fail: 0 };
  for (const id in job.results) counts[job.results[id] === 'pass' ? 'pass' : job.results[id] === 'warn' ? 'warn' : 'fail']++;

  const wrap = el(`
    <div>
      <div class="crumbs"><a data-nav="#/projects">Projects</a><span class="sep">/</span><a data-nav="#/projects/${project.id}">${esc(project.name)}</a><span class="sep">/</span>${esc(job.id)}</div>
      <div class="row">
        <h1 style="margin:0">${esc(job.title)}</h1>
        <span class="tag">${job.state}</span>
        <span class="tag">${job.cli}</span>
        <span class="tag">${job.runs} runs</span>
      </div>
      <div class="result-strip">
        ${counts.pass ? `<span class="result-chip pass"><span class="dot"></span>${counts.pass} pass</span>` : ''}
        ${counts.warn ? `<span class="result-chip warn"><span class="dot"></span>${counts.warn} warn</span>` : ''}
        ${counts.fail ? `<span class="result-chip fail"><span class="dot"></span>${counts.fail} fail</span>` : ''}
        ${(!counts.pass && !counts.warn && !counts.fail) ? `<span class="note">Checks have not run yet.</span>` : ''}
      </div>

      <h2>Task Checks <span class="note" style="text-transform:none; letter-spacing:0">&mdash; ran automatically when this task moved to <code>4-review</code></span></h2>
      <div class="box" id="check-list"></div>

      <h2>Findings</h2>
      <p class="note">Severity is informational. Nothing is blocked. You decide what to do with each finding.</p>
      <div id="finding-list"></div>

      <div class="row" style="margin-top:14px">
        <div class="spacer"></div>
        <button class="btn" data-action="rerun-checks" data-id="${job.id}">Re-run all checks</button>
      </div>
    </div>
  `);
  app.appendChild(wrap);

  const checkList = wrap.querySelector('#check-list');
  for (const { def, on, inherited } of eff) {
    const result = job.results[def.id];
    const sub = result ? `Last run: ${result}` : on ? 'Will run on next review transition' : (inherited ? 'Default off in this project' : 'Not enabled');
    checkList.appendChild(el(`
      <div class="check-row ${on ? '' : 'disabled'}">
        <div class="toggle ${on ? 'on' : ''}" data-action="toggle-job-check" data-job="${job.id}" data-id="${def.id}"></div>
        <div class="label" data-nav="#/quality/${def.id}" style="cursor:pointer">
          <div class="top">
            <strong>${def.id}</strong>
            <span class="tag check">Check</span>
            <span class="tag mode-${def.executionMode}">${def.executionMode}</span>
            <span class="tag sev-${def.severity}">${def.severity}</span>
            ${inherited ? '<span class="inherit">inherited</span>' : ''}
          </div>
          <div class="sub">${esc(def.title)} &middot; ${sub}</div>
        </div>
        ${result ? `<button class="btn ghost" data-action="view-result" data-id="${def.id}">View result</button>` : '<div></div>'}
      </div>
    `));
  }
  checkList.appendChild(el(`
    <div class="check-row" style="border-top: 1px dashed var(--surface0)">
      <div></div>
      <div class="label" style="color:var(--overlay1)">+ Attach another check from the library</div>
      <button class="btn ghost" data-nav="#/quality">Browse library</button>
    </div>
  `));

  const fbox = wrap.querySelector('#finding-list');
  if (!findings.length) fbox.appendChild(el(`<div class="empty">No findings.</div>`));
  for (const f of findings) {
    const def = defById(f.checkId);
    fbox.appendChild(el(`
      <div class="finding ${f.severity === 'high' ? 'high' : f.severity === 'info' ? 'info' : ''} ${f.acked ? 'acked' : ''}" id="finding-${f.id}">
        <div class="head">
          <span class="tag sev-${f.severity}">${f.severity}</span>
          <span class="tag check">${f.checkId}</span>
          <span class="file">${esc(f.file)}</span>
          ${f.acked ? '<span class="tag">acknowledged</span>' : ''}
        </div>
        <p>${esc(f.message)}</p>
        ${f.acked ? '' : `
          <div class="actions row">
            <button class="btn">Open file</button>
            <button class="btn primary" data-action="create-task" data-finding="${f.id}">Create follow-up task</button>
            <button class="btn ghost" data-action="ack-finding" data-job="${job.id}" data-finding="${f.id}">Mark acknowledged</button>
          </div>
        `}
      </div>
    `));
  }
}

//
// === EVENT HANDLING ==================================================
//
document.addEventListener('click', (ev) => {
  const navTarget = ev.target.closest('[data-nav]');
  if (navTarget && !ev.target.closest('[data-action]')) {
    ev.preventDefault();
    navigate(navTarget.dataset.nav);
    return;
  }
  const actionEl = ev.target.closest('[data-action]');
  if (!actionEl) return;
  ev.preventDefault();
  const a = actionEl.dataset.action;

  if (a === 'filter-kind') { ui.libraryFilterKind = actionEl.dataset.value; render(); }
  else if (a === 'filter-dim') { ui.libraryFilterDimension = actionEl.dataset.value; render(); }
  else if (a === 'set-mode') {
    const d = defById(actionEl.dataset.id);
    if (d) { d.executionMode = actionEl.dataset.mode; toast(`${d.id}: execution mode = ${d.executionMode}`); render(); }
  }
  else if (a === 'toggle-default') {
    const p = projectById(actionEl.dataset.project);
    p.taskCheckDefaults[actionEl.dataset.id] = !p.taskCheckDefaults[actionEl.dataset.id];
    toast(`${actionEl.dataset.id}: ${p.taskCheckDefaults[actionEl.dataset.id] ? 'on' : 'off'} for ${p.name}`);
    render();
  }
  else if (a === 'toggle-job-check') {
    const job = jobById(actionEl.dataset.job);
    const id = actionEl.dataset.id;
    const project = projectById(job.project);
    const inherited = !!project.taskCheckDefaults[id];
    const currentlyOn = id in job.enabledOverrides ? job.enabledOverrides[id] : inherited;
    job.enabledOverrides[id] = !currentlyOn;
    toast(`${id}: ${job.enabledOverrides[id] ? 'on' : 'off'} for this task`);
    render();
  }
  else if (a === 'run-audit') { toast(`Audit ${actionEl.dataset.id} queued (mock)`); }
  else if (a === 'run-probe') { toast(`Probe ${actionEl.dataset.id} running (mock)`); }
  else if (a === 'rerun-checks') { toast(`Re-running all checks for this task (mock)`); }
  else if (a === 'view-result') { toast(`View result for ${actionEl.dataset.id} (mock)`); }
  else if (a === 'create-task') { toast(`Created follow-up task (mock)`); }
  else if (a === 'ack-finding') {
    const job = jobById(actionEl.dataset.job);
    const f = job.findings.find(x => x.id === actionEl.dataset.finding);
    if (f) { f.acked = true; toast(`Finding acknowledged`); render(); }
  }
  else if (a === 'ack') { toast(`Acknowledged (mock)`); }
  else if (a === 'export') { toast(`Markdown export (mock)`); }
  else if (a === 'new-def') { toast(`New definition wizard (mock)`); }
});

if (!location.hash) location.hash = '#/quality';
render();
</script>

</body>
</html>
