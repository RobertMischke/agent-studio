<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audits + Checks + Skills - Clickable Prototype</title>
<style>
  :root {
    --base: #1e1e2e;
    --mantle: #181825;
    --crust: #11111b;
    --surface0: #313244;
    --surface1: #45475a;
    --surface2: #585b70;
    --text: #cdd6f4;
    --subtext1: #bac2de;
    --subtext0: #a6adc8;
    --overlay0: #6c7086;
    --overlay1: #7f849c;
    --mauve: #cba6f7;
    --blue: #89b4fa;
    --sky: #89dceb;
    --teal: #94e2d5;
    --green: #a6e3a1;
    --yellow: #f9e2af;
    --peach: #fab387;
    --red: #f38ba8;
    --pink: #f5c2e7;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--mantle); color: var(--text); margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; height: 100%; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; background: var(--surface0); padding: 1px 5px; border-radius: 3px; }

  header.topbar { display: flex; align-items: center; padding: 0 18px; height: 48px; background: var(--base); border-bottom: 1px solid var(--surface0); position: sticky; top: 0; z-index: 50; }
  .brand { color: var(--mauve); font-weight: 700; margin-right: 28px; letter-spacing: 0.02em; }
  .topnav { display: flex; gap: 4px; }
  .topnav a { color: var(--subtext0); padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .topnav a:hover { color: var(--text); background: var(--surface0); text-decoration: none; }
  .topnav a.active { color: var(--text); background: var(--surface0); }
  .topnav a.new { color: var(--mauve); }
  .topbar .spacer { flex: 1; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--peach); color: var(--crust); font-weight: 600; letter-spacing: 0.05em; }

  main { padding: 24px 32px 80px; max-width: 1320px; margin: 0 auto; }
  .crumbs { font-size: 12px; color: var(--overlay1); margin-bottom: 14px; }
  .crumbs a { color: var(--overlay1); cursor: pointer; }
  .crumbs a:hover { color: var(--subtext0); }
  .crumbs .sep { margin: 0 6px; color: var(--surface2); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 13px; margin: 28px 0 10px; color: var(--subtext0); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  .lede { color: var(--subtext0); margin: 0 0 22px; max-width: 820px; }
  .note { color: var(--overlay1); font-size: 12px; }
  .empty { padding: 36px; text-align: center; color: var(--overlay1); }
  hr { border: none; border-top: 1px solid var(--surface0); margin: 18px 0; }

  /* Sidebar */
  .with-sidebar { display: grid; grid-template-columns: 220px 1fr; gap: 22px; }
  .sidebar { background: var(--base); border: 1px solid var(--surface0); border-radius: 8px; padding: 12px; height: fit-content; position: sticky; top: 70px; }
  .sidebar .group { color: var(--overlay0); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin: 8px 8px 4px; }
  .sidebar a { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 5px; color: var(--subtext1); font-size: 13px; cursor: pointer; }
  .sidebar a:hover { background: var(--surface0); color: var(--text); text-decoration: none; }
  .sidebar a.active { background: var(--surface0); color: var(--text); }
  .sidebar a .count { color: var(--overlay0); font-size: 11px; }

  /* Chips */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 4px 12px; border-radius: 999px; font-size: 12px; background: var(--surface0); color: var(--subtext0); cursor: pointer; user-select: none; border: 1px solid transparent; }
  .chip:hover { color: var(--text); }
  .chip.active { background: var(--surface1); color: var(--text); border-color: var(--surface2); }

  /* Cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .card { background: var(--base); border: 1px solid var(--surface0); border-radius: 8px; padding: 14px; cursor: pointer; transition: border-color 0.12s, transform 0.12s; }
  .card:hover { border-color: var(--surface2); }
  .card:active { transform: translateY(1px); }
  .card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .card .id { font-family: ui-monospace, monospace; font-size: 11px; color: var(--overlay0); }
  .card .title { font-weight: 600; flex: 1; min-width: 100%; margin-top: 2px; }
  .card p { margin: 6px 0 10px; color: var(--subtext0); font-size: 13px; }
  .card .meta { display: flex; gap: 6px; flex-wrap: wrap; }

  /* Tags */
  .tag { font-size: 10.5px; padding: 2px 8px; border-radius: 4px; background: var(--surface0); color: var(--subtext0); white-space: nowrap; letter-spacing: 0.02em; }
  .tag.audit { color: var(--mauve); background: rgba(203,166,247,0.14); }
  .tag.check { color: var(--green); background: rgba(166,227,161,0.14); }
  .tag.probe { color: var(--sky); background: rgba(137,220,235,0.14); }
  .tag.scope { color: var(--blue); background: rgba(137,180,250,0.12); }
  .tag.dim { color: var(--peach); background: rgba(250,179,135,0.12); }
  .tag.sev-warn { color: var(--yellow); background: rgba(249,226,175,0.12); }
  .tag.sev-high { color: var(--red); background: rgba(243,139,168,0.12); }
  .tag.sev-info { color: var(--subtext0); background: rgba(186,194,222,0.10); }
  .tag.mode-spawn { color: var(--teal); background: rgba(148,226,213,0.12); }
  .tag.mode-inject { color: var(--pink); background: rgba(245,194,231,0.12); }
  .tag.installed { color: var(--green); background: rgba(166,227,161,0.14); }
  .tag.license { color: var(--sky); background: rgba(137,220,235,0.10); font-family: ui-monospace, monospace; }

  .btn { background: var(--surface0); color: var(--text); border: 1px solid var(--surface1); padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn:hover { background: var(--surface1); }
  .btn.primary { background: var(--mauve); color: var(--crust); border-color: var(--mauve); font-weight: 600; }
  .btn.primary:hover { background: var(--pink); border-color: var(--pink); }
  .btn.warn { background: var(--yellow); color: var(--crust); border-color: var(--yellow); font-weight: 600; }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row .spacer { flex: 1; }

  /* Toggle rows */
  .check-row { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--surface0); }
  .check-row:last-child { border-bottom: none; }
  .check-row.disabled { opacity: 0.55; }
  .toggle { width: 32px; height: 18px; background: var(--surface1); border-radius: 999px; position: relative; cursor: pointer; transition: background 0.15s; flex-shrink: 0; }
  .toggle::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--overlay0); top: 2px; left: 2px; transition: 0.15s; }
  .toggle.on { background: var(--green); }
  .toggle.on::after { left: 16px; background: var(--crust); }
  .check-row .label { font-size: 13px; }
  .check-row .label .top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .check-row .label .sub { color: var(--overlay1); font-size: 11.5px; margin-top: 3px; }
  .inherit { font-size: 10px; color: var(--overlay0); padding: 1px 6px; border: 1px dashed var(--surface1); border-radius: 3px; }

  .box { background: var(--base); border: 1px solid var(--surface0); border-radius: 8px; }
  .box.padded { padding: 16px; }

  /* Findings */
  .finding { padding: 12px 14px; border-left: 3px solid var(--yellow); background: rgba(249,226,175,0.05); margin: 8px 0; border-radius: 0 6px 6px 0; }
  .finding.high { border-left-color: var(--red); background: rgba(243,139,168,0.06); }
  .finding.info { border-left-color: var(--blue); background: rgba(137,180,250,0.05); }
  .finding.acked { opacity: 0.5; border-left-color: var(--overlay0); background: transparent; }
  .finding .head { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
  .finding .file { font-family: ui-monospace, monospace; font-size: 12px; color: var(--blue); }
  .finding p { margin: 4px 0; font-size: 13px; color: var(--subtext1); }
  .finding .actions { margin-top: 8px; }

  .result-strip { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
  .result-chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px; }
  .result-chip.pass { background: rgba(166,227,161,0.14); color: var(--green); }
  .result-chip.warn { background: rgba(249,226,175,0.14); color: var(--yellow); }
  .result-chip.fail { background: rgba(243,139,168,0.14); color: var(--red); }
  .result-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .bar-row { display: grid; grid-template-columns: 160px 1fr 90px; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
  .bar-track { height: 8px; background: var(--surface0); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--green); }
  .bar-fill.warn { background: var(--yellow); }
  .bar-fill.fail { background: var(--red); }
  .num { font-family: ui-monospace, monospace; color: var(--subtext1); text-align: right; }

  .two-pane { display: grid; grid-template-columns: 2fr 1fr; gap: 22px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; font-size: 13px; }
  .kv dt { color: var(--overlay1); }
  .kv dd { margin: 0; color: var(--text); word-break: break-all; }

  /* Radio cards */
  .radio-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .radio-card { background: var(--mantle); border: 1px solid var(--surface0); border-radius: 8px; padding: 12px; cursor: pointer; transition: border-color 0.12s; }
  .radio-card:hover { border-color: var(--surface2); }
  .radio-card.selected { border-color: var(--mauve); background: rgba(203,166,247,0.06); }
  .radio-card .top { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .radio-card .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--surface2); flex-shrink: 0; }
  .radio-card.selected .dot { border-color: var(--mauve); background: var(--mauve); box-shadow: inset 0 0 0 2px var(--crust); }
  .radio-card h4 { margin: 0; font-size: 14px; }
  .radio-card p { margin: 6px 0 0; color: var(--subtext0); font-size: 12.5px; }
  .radio-card .pros, .radio-card .cons { font-size: 11.5px; margin: 4px 0 0; padding-left: 14px; }
  .radio-card .pros li { color: var(--green); }
  .radio-card .cons li { color: var(--peach); }

  .md-block { background: var(--mantle); border: 1px solid var(--surface0); border-radius: 6px; padding: 12px; font-family: ui-monospace, monospace; font-size: 12.5px; white-space: pre-wrap; color: var(--subtext1); }

  /* Project page sections */
  .proj-section { margin-bottom: 28px; }
  .proj-section > h3 { margin: 0 0 12px; padding-bottom: 6px; font-size: 14px; font-weight: 600; color: var(--subtext1); border-bottom: 1px solid var(--surface0); }
  .paths { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
  .paths dt { color: var(--overlay1); }
  .paths dd { margin: 0; font-family: ui-monospace, monospace; color: var(--text); word-break: break-all; }
  .modes { display: flex; gap: 6px; }
  .mode-btn { padding: 6px 12px; background: var(--surface0); border: 1px solid var(--surface1); border-radius: 6px; color: var(--subtext0); cursor: pointer; font-size: 13px; }
  .mode-btn.active { background: var(--mauve); border-color: var(--mauve); color: var(--crust); font-weight: 600; }
  .lane-counts { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .lane-count { background: var(--base); border: 1px solid var(--surface0); border-radius: 6px; padding: 10px; text-align: center; }
  .lane-count .num { font-size: 18px; color: var(--text); font-family: inherit; }
  .lane-count .lbl { font-size: 11px; color: var(--overlay1); margin-top: 2px; }

  /* Featured Security Panel */
  .security-panel {
    background: linear-gradient(135deg, rgba(243,139,168,0.06), rgba(203,166,247,0.06));
    border: 1px solid rgba(243,139,168,0.30);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 28px;
  }
  .security-panel.alert { border-color: rgba(243,139,168,0.55); background: linear-gradient(135deg, rgba(243,139,168,0.10), rgba(250,179,135,0.06)); }
  .security-panel.good { border-color: rgba(166,227,161,0.30); background: linear-gradient(135deg, rgba(166,227,161,0.08), rgba(148,226,213,0.05)); }
  .security-panel .head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .security-panel .head .icon { font-size: 18px; }
  .security-panel .head h3 { margin: 0; font-size: 16px; color: var(--text); }
  .security-panel .head .rating { font-size: 11px; padding: 2px 10px; border-radius: 999px; font-weight: 600; }
  .security-panel .head .rating.good { background: var(--green); color: var(--crust); }
  .security-panel .head .rating.warn { background: var(--yellow); color: var(--crust); }
  .security-panel .head .rating.bad { background: var(--red); color: var(--crust); }
  .security-panel .summary { color: var(--subtext1); font-size: 13px; margin: 8px 0 14px; }
  .security-panel .meta-line { color: var(--overlay1); font-size: 12px; margin-bottom: 14px; }
  .security-panel .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .security-panel .files { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--surface1); }
  .security-panel .files .file-line { display: flex; gap: 8px; align-items: center; padding: 4px 0; font-size: 13px; }
  .security-panel .files .file-line code { font-size: 12px; }

  /* Skill repository */
  .skill-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--surface0); margin-bottom: 18px; }
  .skill-tabs a { padding: 8px 16px; color: var(--subtext0); cursor: pointer; border-bottom: 2px solid transparent; font-size: 13px; font-weight: 500; }
  .skill-tabs a:hover { color: var(--text); text-decoration: none; }
  .skill-tabs a.active { color: var(--text); border-bottom-color: var(--mauve); }
  .skill-tabs .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface0); color: var(--subtext0); margin-left: 6px; }

  .search-bar { background: var(--base); border: 1px solid var(--surface0); border-radius: 8px; padding: 8px 12px; display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .search-bar input { background: transparent; border: none; color: var(--text); font: inherit; flex: 1; outline: none; }
  .search-bar .icon { color: var(--overlay1); }

  .skill-card { background: var(--base); border: 1px solid var(--surface0); border-radius: 8px; padding: 14px; transition: border-color 0.12s; cursor: pointer; }
  .skill-card:hover { border-color: var(--surface2); }
  .skill-card.featured { border-color: var(--mauve); background: linear-gradient(135deg, var(--base), rgba(203,166,247,0.04)); }
  .skill-card .name { font-weight: 600; font-size: 14px; }
  .skill-card .id { font-family: ui-monospace, monospace; font-size: 11px; color: var(--overlay0); margin-top: 2px; }
  .skill-card p { margin: 8px 0 10px; color: var(--subtext0); font-size: 13px; min-height: 38px; }
  .skill-card .stats { display: flex; gap: 12px; font-size: 11.5px; color: var(--overlay1); margin-bottom: 10px; }
  .skill-card .stats span { display: flex; align-items: center; gap: 4px; }
  .skill-card .actions { display: flex; gap: 6px; }
  .featured-banner { display: inline-block; font-size: 10px; background: var(--mauve); color: var(--crust); padding: 1px 7px; border-radius: 3px; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 6px; }

  /* License notices table */
  .lic-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lic-table th, .lic-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--surface0); }
  .lic-table th { color: var(--overlay1); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .lic-table tr:last-child td { border-bottom: none; }
  .lic-table .src { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--blue); }

  /* Project rows */
  .project-row { padding: 14px; border-bottom: 1px solid var(--surface0); cursor: pointer; display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center; }
  .project-row:hover { background: var(--surface0); }
  .project-row .name { font-weight: 600; }
  .project-row .path { font-family: ui-monospace, monospace; font-size: 12px; color: var(--overlay1); margin-top: 2px; }
  .project-row .summary { font-size: 12px; color: var(--subtext0); }
  .project-row .sec-mini { font-size: 11px; padding: 1px 8px; border-radius: 3px; font-weight: 600; }
  .project-row .sec-mini.good { background: var(--green); color: var(--crust); }
  .project-row .sec-mini.warn { background: var(--yellow); color: var(--crust); }
  .project-row .sec-mini.bad { background: var(--red); color: var(--crust); }
  .project-row .sec-mini.none { background: var(--overlay0); color: var(--crust); }

  /* File list (architecture / security) */
  .file-list { padding: 0; list-style: none; margin: 0; }
  .file-list li { padding: 8px 12px; border-bottom: 1px solid var(--surface0); display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .file-list li:last-child { border-bottom: none; }
  .file-list li:hover { background: var(--surface0); }
  .file-list code { font-size: 12.5px; }

  /* === VS Code-style project shell ============================== */
  .project-shell { display: grid; grid-template-columns: 220px 1fr; border: 1px solid var(--surface0); border-radius: 8px; overflow: hidden; background: var(--base); min-height: 70vh; }
  .proj-nav { background: var(--mantle); border-right: 1px solid var(--surface0); padding: 10px 6px; }
  .proj-nav .group { color: var(--overlay0); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; margin: 8px 12px 4px; }
  .proj-nav a { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 4px; font-size: 13px; color: var(--subtext1); cursor: pointer; border-left: 2px solid transparent; user-select: none; }
  .proj-nav a:hover { background: var(--surface0); color: var(--text); text-decoration: none; }
  .proj-nav a.active { background: var(--surface0); color: var(--text); border-left-color: var(--mauve); }
  .proj-nav a .icon { width: 14px; text-align: center; }
  .proj-nav a .badge { margin-left: auto; font-size: 10.5px; color: var(--overlay0); padding: 1px 7px; border-radius: 999px; background: var(--surface0); }
  .proj-nav a.active .badge { background: var(--surface1); color: var(--subtext1); }
  .proj-nav a .badge.warn { background: var(--yellow); color: var(--crust); }
  .proj-nav a .badge.bad { background: var(--red); color: var(--crust); }
  .proj-nav a .badge.good { background: var(--green); color: var(--crust); }

  .proj-content { padding: 14px 22px 26px; overflow-y: auto; min-width: 0; }
  .proj-content > .section-head { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--surface0); margin-bottom: 10px; }
  .proj-content > .section-head h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--text); text-transform: none; letter-spacing: 0; }
  .proj-content > .section-head .desc { color: var(--overlay1); font-size: 12.5px; }

  /* Accordion panel */
  .panel { border-bottom: 1px solid var(--surface0); }
  .panel:last-child { border-bottom: none; }
  .panel-head { display: flex; align-items: center; gap: 8px; padding: 10px 4px; cursor: pointer; user-select: none; color: var(--subtext1); }
  .panel-head:hover { color: var(--text); }
  .panel-head .chevron { font-size: 11px; color: var(--overlay1); transition: transform 0.15s; width: 10px; display: inline-block; }
  .panel.collapsed .panel-head .chevron { transform: rotate(-90deg); }
  .panel-head .title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--subtext0); }
  .panel-head .meta { color: var(--overlay1); font-size: 12px; margin-left: 4px; }
  .panel-head .actions { margin-left: auto; display: flex; gap: 6px; }
  .panel-head .actions .btn { padding: 3px 9px; font-size: 11.5px; }
  .panel-body { padding: 4px 4px 14px; }
  .panel.collapsed .panel-body { display: none; }
  .panel.collapsed .panel-head { padding-bottom: 10px; }

  /* Dashboard cards (Overview) */
  .dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .dash-card { background: var(--mantle); border: 1px solid var(--surface0); border-radius: 6px; padding: 12px; cursor: pointer; transition: border-color 0.12s; }
  .dash-card:hover { border-color: var(--surface2); }
  .dash-card .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--overlay1); }
  .dash-card .val { font-size: 17px; margin: 6px 0 4px; color: var(--text); font-weight: 600; }
  .dash-card .sub { font-size: 12px; color: var(--subtext0); }
  .dash-card.alert { border-color: rgba(243,139,168,0.40); background: rgba(243,139,168,0.05); }
  .dash-card.good { border-color: rgba(166,227,161,0.30); }

  .activity-feed { font-size: 12.5px; }

const $ = (id) => document.getElementById(id);
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._h); toast._h = setTimeout(()=>t.classList.remove('show'), 1900); }

function projectById(id) { return projects.find(p => p.id === id); }
function jobById(id) { return jobs.find(j => j.id === id); }
function allSkills() { return [...installedSkills, ...skillRepository.filter(r => !installedSkills.find(i => i.id === r.id))]; }
function skillById(id) { return allSkills().find(s => s.id === id); }
function isInstalled(id) { return !!installedSkills.find(s => s.id === id); }
function ratingClass(r) { if (!r) return 'none'; if (r === 'Baseline OK') return 'good'; if (r === 'Needs review') return 'warn'; return 'bad'; }

function tagsForDef(d) {
  const t = [`<span class="tag ${d.kind}">${esc(d.kind === 'check' ? 'Task Check' : d.kind === 'audit' ? 'Audit' : 'Probe')}</span>`];

  t.push(`<span class="tag dim">${esc(d.dimension)}</span>`);
  t.push(`<span class="tag sev-${d.severity}">${esc(d.severity)}</span>`);
  if (d.executionMode) t.push(`<span class="tag mode-${d.executionMode}">mode: ${esc(d.executionMode)}</span>`);
  return t.join(' ');
}

function effectiveChecksForJob(job) {
  const project = projectById(job.project);
  const out = [];
  for (const def of definitions.filter(d => d.kind === 'check')) {
    const inheritedOn = !!project.taskCheckDefaults[def.id];
    let on = inheritedOn;
    if (def.id in job.enabledOverrides) on = job.enabledOverrides[def.id];
    if (job.extra.includes(def.id)) on = true;
    out.push({ def, on, inherited: inheritedOn });
  }
  return out;
}

    overview: renderProjOverview,

    architecture: renderProjArchitecture,
    quality: renderProjQuality,
    jobs: renderProjJobs,
    settings: renderProjSettings,
    orchestrator: renderProjOrchestrator,
    activity: renderProjActivity,
  };
  (renderers[ui.projectSection] || renderProjOverview)(content, project, projectJobs);
}

// ---- helper for collapsible panels ----
function panel(key, title, opts = {}) {
  const collapsed = !!ui.collapsedPanels[key];
  const meta = opts.meta ? `<span class="meta">${opts.meta}</span>` : '';
  const actions = opts.actions ? `<div class="actions" data-stop>${opts.actions}</div>` : '';
  const wrap = el(`
    <section class="panel ${collapsed?'collapsed':''}" data-panel="${esc(key)}">
      <header class="panel-head" data-action="toggle-panel" data-key="${esc(key)}">
        <span class="chevron">▾</span><span class="title">${title}</span>${meta}${actions}
      </header>
      <div class="panel-body"></div>
    </section>
  `);
  return wrap;
}
function pBody(p) { return p.querySelector('.panel-body'); }

// ---- Jobs ----
function renderProjJobs(content, project, projectJobs) {
  content.appendChild(el(`<div class="section-head"><h2>📋 Jobs</h2><span class="desc">Tasks queued, in progress, and recently completed</span></div>`));
  const byState = {};
  for (const j of projectJobs) (byState[j.state] = byState[j.state] || []).push(j);
  const order = ['1-preparation','2-ready','3-progress','4-review','5-completed','6-archive'];
  for (const st of order) {
    if (!byState[st] || !byState[st].length) continue;
    const p = panel('jobs-'+st, st, { meta: byState[st].length + ' task(s)' });
    const box = el(`<div class="box"></div>`);
    for (const j of byState[st]) {
      box.appendChild(el(`
        <div class="check-row" data-nav="#/jobs/${j.id}" style="cursor:pointer">
          <div></div>
          <div class="label">
            <div class="top"><strong>${esc(j.title)}</strong> <span class="tag">${j.cli}</span></div>
            <div class="sub">${j.runs} run(s) &middot; ${j.findings.filter(f=>!f.acked).length} open finding(s)</div>
          </div>
          <div></div>
        </div>
      `));
    }
    pBody(p).appendChild(box);
    content.appendChild(p);
  }
  if (!projectJobs.length) content.appendChild(el(`<p class="note" style="padding:14px 4px">No jobs.</p>`));
}

function renderSkills(app, parts) {
  if (parts.length > 1) return renderSkillDetail(app, parts[1]);

  const installedCount = installedSkills.length;
  const wrap = el(`<div>
    <h1>Skills</h1>
    <p class="lede">Reusable workflows that produce or transform work. Audits and Task Checks are review definitions, not Skills; they appear under <a data-nav="#/quality">Review definitions</a>. Repository discovery is shown as a future preview only.</p>
    <div class="skill-tabs" id="skill-tabs">
      <a data-action="skills-tab" data-value="installed" class="${ui.skillsTab==='installed'?'active':''}">Installed workflows <span class="badge">${installedCount}</span></a>

}

  body.appendChild(el(`<p class="note" style="margin-bottom:10px">Local workflow Skills active in this installation. Built-in skills cannot be uninstalled. Audits and Task Checks are managed separately as review definitions.</p>`));

  body.appendChild(filterRow);

  filterRow.querySelector('#skill-search').addEventListener('input', (e) => { ui.skillsSearch = e.target.value; render(); });

  const featuredEntries = skillRepository.filter(s => s.featured);
  if (featuredEntries.length && ui.skillsSearch === '' && ui.skillsRepoDimension === 'all' && ui.skillsTypeFilter === 'all') {
    body.appendChild(el(`<h2>Featured</h2>`));
    const fGrid = el(`<div class="grid"></div>`);
    body.appendChild(fGrid);
    for (const s of featuredEntries) fGrid.appendChild(skillRepoCard(s, true));
    body.appendChild(el(`<h2 style="margin-top:28px">All preview entries</h2>`));
  }

  const filtered = skillRepository.filter(s => {
    if (ui.skillsRepoDimension !== 'all' && s.dimension !== ui.skillsRepoDimension) return false;
    if (ui.skillsTypeFilter !== 'all' && s.type !== ui.skillsTypeFilter) return false;
    if (ui.skillsSearch) {
      const q = ui.skillsSearch.toLowerCase();
      if (!s.name.toLowerCase().includes(q) && !s.description.toLowerCase().includes(q) && !s.dimension.toLowerCase().includes(q)) return false;
    }
    return true;
  });
  const grid = el(`<div class="grid"></div>`);
  body.appendChild(grid);
  if (!filtered.length) grid.appendChild(el(`<div class="empty">No preview entries match.</div>`));
  for (const s of filtered) grid.appendChild(skillRepoCard(s, false));

  body.appendChild(el(`<p class="note" style="margin-top:24px">Curated catalog preview. License is shown on every card; actual installation stays disabled until local skill mechanics are stable.</p>`));
}

function licenseDesc(lic) {
  const map = {
    'MIT':'Permissive. Commercial use OK. Attribution required.',
    'Apache-2.0':'Permissive with patent grant. Commercial use OK. Attribution + NOTICE file.',
    'BSD-3-Clause':'Permissive. Commercial use OK. Attribution + no-endorsement clause.',
    'ISC':'Permissive, simpler than MIT. Commercial use OK. Attribution required.',
    'GPL-3.0':'Copyleft. Derivative works must also be GPL. Review before use in proprietary projects.',
  };
  return map[lic] || 'Custom license; review before use.';
}

function renderJob(app, parts) {
  const job = jobById(parts[1]);
  if (!job) return app.appendChild(el(`<div class="empty">Job not found</div>`));
  const project = projectById(job.project);
  const eff = effectiveChecksForJob(job);
  const findings = job.findings;
  const counts = { pass: 0, warn: 0, fail: 0 };
  for (const id in job.results) counts[job.results[id] === 'pass' ? 'pass' : job.results[id] === 'warn' ? 'warn' : 'fail']++;

  const wrap = el(`<div>
    <div class="crumbs"><a data-nav="#/projects">Projects</a><span class="sep">/</span><a data-nav="#/projects/${project.id}">${esc(project.name)}</a><span class="sep">/</span>${esc(job.id)}</div>
    <div class="row"><h1 style="margin:0">${esc(job.title)}</h1><span class="tag">${job.state}</span><span class="tag">${job.cli}</span><span class="tag">${job.runs} runs</span></div>
    <div class="result-strip">
      ${counts.pass ? `<span class="result-chip pass"><span class="dot"></span>${counts.pass} pass</span>` : ''}
      ${counts.warn ? `<span class="result-chip warn"><span class="dot"></span>${counts.warn} warn</span>` : ''}
      ${counts.fail ? `<span class="result-chip fail"><span class="dot"></span>${counts.fail} fail</span>` : ''}
      ${(!counts.pass && !counts.warn && !counts.fail) ? `<span class="note">Checks have not run yet.</span>` : ''}
    </div>
    <h2>Task Checks <span class="note" style="text-transform:none; letter-spacing:0">- review evidence attached to this task</span></h2>
    <div class="box" id="check-list"></div>
    <h2>Findings</h2>
    <p class="note">Severity is informational. Nothing is blocked. You decide what to do.</p>
    <div id="finding-list"></div>
    <div class="row" style="margin-top:14px"><div class="spacer"></div><button class="btn" data-action="rerun-checks" data-id="${job.id}">Re-run all checks</button></div>
  </div>`);
  app.appendChild(wrap);

  const checkList = wrap.querySelector('#check-list');
  for (const { def, on, inherited } of eff) {
    const result = job.results[def.id];
    const sub = result ? `Last run: ${result}` : on ? 'Will run on next review transition' : (inherited ? 'Default off in project' : 'Not enabled');
    checkList.appendChild(el(`
      <div class="check-row ${on ? '' : 'disabled'}">
        <div class="toggle ${on ? 'on' : ''}" data-action="toggle-job-check" data-job="${job.id}" data-id="${def.id}"></div>
        <div class="label" data-nav="#/quality/${def.id}" style="cursor:pointer">
          <div class="top">
            <strong>${def.id}</strong>
            <span class="tag check">Check</span>
            <span class="tag mode-${def.executionMode}">${def.executionMode}</span>
            <span class="tag sev-${def.severity}">${def.severity}</span>
            ${inherited ? '<span class="inherit">inherited</span>' : ''}
          </div>
          <div class="sub">${esc(def.title)} &middot; ${sub}</div>
        </div>
        ${result ? `<button class="btn ghost" data-action="view-result" data-id="${def.id}">View result</button>` : '<div></div>'}
      </div>
    `));
  }
  checkList.appendChild(el(`<div class="check-row" style="border-top: 1px dashed var(--surface0)"><div></div><div class="label" style="color:var(--overlay1)">+ Attach another check from the library</div><button class="btn ghost" data-nav="#/quality">Browse library</button></div>`));

  const fbox = wrap.querySelector('#finding-list');
  if (!findings.length) fbox.appendChild(el(`<div class="empty">No findings.</div>`));
  for (const f of findings) {
    fbox.appendChild(el(`
      <div class="finding ${f.severity === 'high' ? 'high' : f.severity === 'info' ? 'info' : ''} ${f.acked ? 'acked' : ''}">
        <div class="head"><span class="tag sev-${f.severity}">${f.severity}</span><span class="tag check">${f.checkId}</span><span class="file">${esc(f.file)}</span>${f.acked ? '<span class="tag">acknowledged</span>' : ''}</div>
        <p>${esc(f.message)}</p>
        ${f.acked ? '' : `<div class="actions row"><button class="btn">Open file</button><button class="btn primary" data-action="create-task" data-finding="${f.id}">Create follow-up task</button><button class="btn ghost" data-action="ack-finding" data-job="${job.id}" data-finding="${f.id}">Mark acknowledged</button></div>`}
      </div>
    `));
  }
}

document.addEventListener('click', (ev) => {
  const navTarget = ev.target.closest('[data-nav]');
  if (navTarget && !ev.target.closest('[data-action]')) { ev.preventDefault(); navigate(navTarget.dataset.nav); return; }
  const actionEl = ev.target.closest('[data-action]');
  if (!actionEl) return;
  ev.preventDefault();
  const a = actionEl.dataset.action;

  if (a === 'filter-kind') { ui.libraryFilterKind = actionEl.dataset.value; render(); }
  else if (a === 'filter-dim') { ui.libraryFilterDimension = actionEl.dataset.value; render(); }
  else if (a === 'set-mode' && actionEl.dataset.id && actionEl.dataset.mode && defById(actionEl.dataset.id)) {
    const d = defById(actionEl.dataset.id); d.executionMode = actionEl.dataset.mode; toast(`${d.id}: execution mode = ${d.executionMode}`); render();
  }
  else if (a === 'toggle-default') {
    const p = projectById(actionEl.dataset.project); p.taskCheckDefaults[actionEl.dataset.id] = !p.taskCheckDefaults[actionEl.dataset.id];
    toast(`${actionEl.dataset.id}: ${p.taskCheckDefaults[actionEl.dataset.id] ? 'on' : 'off'} for ${p.name}`); render();
  }
  else if (a === 'toggle-job-check') {
    const job = jobById(actionEl.dataset.job); const id = actionEl.dataset.id;
    const project = projectById(job.project); const inherited = !!project.taskCheckDefaults[id];
    const currentlyOn = id in job.enabledOverrides ? job.enabledOverrides[id] : inherited;
    job.enabledOverrides[id] = !currentlyOn; toast(`${id}: ${job.enabledOverrides[id] ? 'on' : 'off'} for this task`); render();
  }
  else if (a === 'set-runner-mode') {
    const p = projectById(actionEl.dataset.id); p.runnerMode = actionEl.dataset.mode; toast(`Runner mode: ${p.runnerMode}`); render();
  }
  else if (a === 'proj-section') { ui.projectSection = actionEl.dataset.value; render(); }
  else if (a === 'toggle-panel') {
    const key = actionEl.dataset.key;
    ui.collapsedPanels[key] = !ui.collapsedPanels[key];
    const p = actionEl.closest('.panel');
    if (p) p.classList.toggle('collapsed', ui.collapsedPanels[key]);
  }
  else if (a === 'set-model') { /* select handled separately */ }
  else if (a === 'toggle-auto-commit') { const p = projectById(actionEl.dataset.id); p.autoCommit = !p.autoCommit; toast(`Auto-commit: ${p.autoCommit ? 'on' : 'off'}`); render(); }
  else if (a === 'open-feed') { toast('Open feed (mock)'); }
  else if (a === 'security-files') { toast('Open security file browser (mock)'); }
  else if (a === 'run-audit') { toast(`Audit ${actionEl.dataset.id} queued (mock)`); }
  else if (a === 'run-probe') { toast(`Probe ${actionEl.dataset.id} running (mock)`); }
  else if (a === 'rerun-checks') { toast(`Re-running checks (mock)`); }
  else if (a === 'view-result') { toast(`View result for ${actionEl.dataset.id} (mock)`); }
  else if (a === 'create-task') { toast(`Created follow-up task (mock)`); }
  else if (a === 'ack-finding') {
    const job = jobById(actionEl.dataset.job); const f = job.findings.find(x => x.id === actionEl.dataset.finding);
    if (f) { f.acked = true; toast('Finding acknowledged'); render(); }
  }
  else if (a === 'ack') { toast('Acknowledged (mock)'); }
  else if (a === 'export') { toast('Markdown export (mock)'); }
  else if (a === 'new-def') { toast('New definition wizard (mock)'); }
  else if (a === 'skills-tab') { ui.skillsTab = actionEl.dataset.value; render(); }
  else if (a === 'repo-dim') { ui.skillsRepoDimension = actionEl.dataset.value; render(); }
  else if (a === 'skills-type') { ui.skillsTypeFilter = actionEl.dataset.value; render(); }
  else if (a === 'install-skill') {
    const s = skillRepository.find(r => r.id === actionEl.dataset.id);
    if (!s) return;
    toast(`Repository install is deferred in this mock: ${s.name}`);
  }
  else if (a === 'uninstall-skill') {
    const idx = installedSkills.findIndex(s => s.id === actionEl.dataset.id);
    if (idx >= 0 && installedSkills[idx].source !== 'built-in') { installedSkills.splice(idx, 1); toast('Skill uninstalled &middot; attribution kept in licenses.md per policy'); render(); }
  }
  else if (a === 'close-dialog') { closeDialog(); }
});

document.addEventListener('change', (ev) => {
  const select = ev.target.closest('select[data-action="set-model"]');
  if (select) { const p = projectById(select.dataset.id); p.orchestratorModel = select.value; toast(`Model: ${p.orchestratorModel}`); }
});

if (!location.hash) location.hash = '#/projects/agent-taskboard-dev';
render();
</script>

</body>
</html>
