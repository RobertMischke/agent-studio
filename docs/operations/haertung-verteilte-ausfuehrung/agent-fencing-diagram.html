<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent fencing: authority and quarantine diagram</title>
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --bg-soft: #f6f6f7;
  --bg-elv: #ffffff;
  --ink-1: #3c3c43;
  --ink-2: #67676c;
  --ink-3: #929295;
  --line: #e2e2e3;
  --border: #c2c2c4;
  --blue: #3b82f6;
  --blue-ink: #2f6fd6;
  --blue-soft: #e7f0fe;
  --blue-bd: rgba(59,130,246,.42);
  --blue-glow: rgba(59,130,246,.20);
  --teal: #14a37f;
  --teal-ink: #0f8e6e;
  --teal-soft: #e6f6f1;
  --teal-bd: rgba(20,163,127,.42);
  --coral: #e5484d;
  --coral-soft: rgba(229,72,77,.08);
  --coral-bd: rgba(229,72,77,.34);
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --chip-shadow: 0 3px 12px rgba(0,0,0,.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1b1b1f;
    --bg-soft: #202127;
    --bg-elv: #202127;
    --ink-1: #dfdfd6;
    --ink-2: #98989f;
    --ink-3: #6a6a71;
    --line: #2e2e32;
    --border: #3c3f44;
    --blue: #4c8dff;
    --blue-ink: #a8b1ff;
    --blue-soft: #1c2740;
    --blue-bd: rgba(90,150,255,.50);
    --blue-glow: rgba(76,141,255,.30);
    --teal: #34d3a6;
    --teal-ink: #4fe0b6;
    --teal-soft: #16302a;
    --teal-bd: rgba(52,211,166,.48);
    --coral: #f06a6f;
    --coral-soft: rgba(240,106,111,.10);
    --coral-bd: rgba(240,106,111,.40);
    --chip-shadow: 0 3px 14px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1b1b1f;
  --bg-soft: #202127;
  --bg-elv: #202127;
  --ink-1: #dfdfd6;
  --ink-2: #98989f;
  --ink-3: #6a6a71;
  --line: #2e2e32;
  --border: #3c3f44;
  --blue: #4c8dff;
  --blue-ink: #a8b1ff;
  --blue-soft: #1c2740;
  --blue-bd: rgba(90,150,255,.50);
  --blue-glow: rgba(76,141,255,.30);
  --teal: #34d3a6;
  --teal-ink: #4fe0b6;
  --teal-soft: #16302a;
  --teal-bd: rgba(52,211,166,.48);
  --coral: #f06a6f;
  --coral-soft: rgba(240,106,111,.10);
  --coral-bd: rgba(240,106,111,.40);
  --chip-shadow: 0 3px 14px rgba(0,0,0,.45);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0 0 70px;
  background: var(--bg);
  color: var(--ink-1);
  font: 16px/1.6 var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
main { max-width: 1120px; margin: 0 auto; padding: 0 28px; }
header { padding: 46px 0 26px; border-bottom: 1px solid var(--line); }
.kicker, .sec-no {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font: 600 12px/1 var(--font-mono);
  letter-spacing: .13em;
  text-transform: uppercase;
}
.kicker {
  color: var(--blue-ink);
  border: 1px solid var(--blue-bd);
  background: var(--blue-soft);
  border-radius: 99px;
  padding: 7px 14px;
  margin: 0 0 18px;
}
.kicker::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
.sec-no { color: var(--coral); margin: 44px 0 8px; }
.sec-no::before { content: ""; width: 14px; height: 1.5px; background: var(--coral); }
h1 { margin: 0 0 12px; font-size: 34px; line-height: 1.17; letter-spacing: -.02em; }
.lede { margin: 0; color: var(--ink-2); font-size: 18px; max-width: 74ch; }
a { color: var(--blue-ink); text-underline-offset: 3px; }
.toggle {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 10;
  cursor: pointer;
  color: var(--ink-2);
  background: var(--bg-elv);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 8px 13px;
  font: 600 11px/1 var(--font-mono);
  letter-spacing: .1em;
  text-transform: uppercase;
}
figure { margin: 0; }
.canvas {
  overflow-x: auto;
  padding: 34px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
}
.stage { position: relative; min-width: 950px; height: 570px; }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.wires .rail, .wires .rail use { fill: none; stroke: var(--line); stroke-width: 1.6; }
.wires .flow {
  fill: none;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-dasharray: 7 12;
  animation: dash 3.6s linear infinite;
}
.wires .execution { stroke: var(--teal); }
.wires .authority { stroke: var(--blue); }
.wires .signal { stroke: var(--coral); }
@keyframes dash { to { stroke-dashoffset: -38; } }
@media (prefers-reduced-motion: reduce) { .wires .flow { animation: none; } }
.node {
  position: absolute;
  padding: 16px 18px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-elv);
  box-shadow: var(--chip-shadow);
}
.node .label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 7px;
  font: 700 12px/1.2 var(--font-mono);
  letter-spacing: .1em;
  text-transform: uppercase;
}
.node .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.node p { margin: 0; color: var(--ink-2); font-size: 13px; line-height: 1.48; }
.node.execution { border-color: var(--teal-bd); background: var(--teal-soft); }
.node.execution .label { color: var(--teal-ink); }
.node.execution .dot { background: var(--teal); }
.node.authority { border-color: var(--blue-bd); background: var(--blue-soft); box-shadow: 0 0 28px var(--blue-glow); }
.node.authority .label { color: var(--blue-ink); }
.node.authority .dot { background: var(--blue); }
.node.signal { border-color: var(--coral-bd); background: var(--coral-soft); }
.node.signal .label { color: var(--coral); }
.node.signal .dot { background: var(--coral); border-radius: 50%; }
.worker { left: 2%; top: 48px; width: 210px; }
.tree { left: 28%; top: 48px; width: 210px; }
.review { left: 52%; top: 48px; width: 205px; }
.platform { right: 2%; top: 48px; width: 205px; }
.origin { right: 2%; top: 246px; width: 205px; }
.violation { left: 28%; top: 246px; width: 210px; }
.quarantine { left: 52%; top: 246px; width: 205px; }
.trust { left: 2%; top: 408px; width: 210px; }
.supervisor { left: 52%; top: 408px; width: 205px; }
.edge-label {
  position: absolute;
  padding: 3px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--ink-3);
  font: 600 10px/1.3 var(--font-mono);
  letter-spacing: .04em;
  white-space: nowrap;
}
.l-edit { left: 22.5%; top: 15px; }
.l-submit { left: 48.5%; top: 15px; }
.l-record { left: 75.5%; top: 15px; }
.l-detect { left: 35%; top: 194px; }
.l-hold { left: 48.2%; top: 214px; }
.l-push { left: 84%; top: 191px; }
.l-sample { left: 32%; top: 483px; }
.legend { display: flex; gap: 20px; flex-wrap: wrap; margin: 18px 0 0; padding: 0; color: var(--ink-2); font-size: 13px; list-style: none; }
.legend li { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 18px; height: 3px; border-radius: 2px; }
.legend .exec-line { background: var(--teal); }
.legend .authority-line { background: var(--blue); }
.legend .signal-line { background: var(--coral); }
figcaption { margin-top: 14px; max-width: 90ch; color: var(--ink-2); font-size: 13.5px; }
figcaption b { color: var(--ink-1); }
footer { margin-top: 42px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 13px; }
</style>
</head>
<body>
<button class="toggle" id="theme-toggle" type="button" aria-label="Toggle light and dark theme">◐ Theme</button>
<main>
  <header>
    <p class="kicker">Diagram · Agent fencing</p>
    <h1>One work path, one quarantine path</h1>
    <p class="lede">Execution stays separate from authority. Trust adjusts supervision, never Git permission.</p>
  </header>

  <p class="sec-no">§1 · Authority flow</p>
  <figure>
    <div class="canvas">
      <div class="stage">
        <svg class="wires" viewBox="0 0 1000 570" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <path id="w-edit" d="M210 108 C236 108 254 108 280 108"/>
            <path id="w-submit" d="M490 108 C502 108 508 108 520 108"/>
            <path id="w-record" d="M725 108 C744 108 756 108 775 108"/>
            <path id="w-origin" d="M878 146 C878 186 878 210 878 246"/>
            <path id="w-detect" d="M385 146 C385 186 385 210 385 246"/>
            <path id="w-hold" d="M490 306 C502 306 508 306 520 306"/>
            <path id="w-escalate" d="M623 364 C623 382 623 392 623 408"/>
            <path id="w-trust" d="M210 468 C330 468 400 468 520 468"/>
          </defs>
          <g class="rail">
            <use href="#w-edit"/><use href="#w-submit"/><use href="#w-record"/><use href="#w-origin"/>
            <use href="#w-detect"/><use href="#w-hold"/><use href="#w-escalate"/><use href="#w-trust"/>
          </g>
          <use class="flow execution" href="#w-edit"/>
          <use class="flow execution" href="#w-submit"/>
          <use class="flow authority" href="#w-record"/>
          <use class="flow authority" href="#w-origin"/>
          <use class="flow signal" href="#w-detect"/>
          <use class="flow signal" href="#w-hold"/>
          <use class="flow signal" href="#w-escalate"/>
          <use class="flow authority" href="#w-trust"/>
        </svg>

        <div class="node execution worker">
          <div class="label"><span class="dot"></span>Worker agent</div>
          <p>Edits assigned files. Reads Git. Does not write history.</p>
        </div>
        <div class="node execution tree">
          <div class="label"><span class="dot"></span>Working tree</div>
          <p>Uncommitted result plus tests, screenshots, and run evidence.</p>
        </div>
        <div class="node authority review">
          <div class="label"><span class="dot"></span>Review gate</div>
          <p>Checks intent, exact diff, evidence, and repository provenance.</p>
        </div>
        <div class="node authority platform">
          <div class="label"><span class="dot"></span>Platform writer</div>
          <p>Creates the commit, stamps the SHA, and owns managed push.</p>
        </div>
        <div class="node authority origin">
          <div class="label"><span class="dot"></span>Git origin</div>
          <p>Receives only platform-approved history through the managed path.</p>
        </div>
        <div class="node signal violation">
          <div class="label"><span class="dot"></span>Violation signal</div>
          <p>Blocked Git verb, unexpected HEAD change, or task/diff mismatch.</p>
        </div>
        <div class="node signal quarantine">
          <div class="label"><span class="dot"></span>Quarantine</div>
          <p>Preserve evidence. Do not accept, merge, overwrite, or discard.</p>
        </div>
        <div class="node authority trust">
          <div class="label"><span class="dot"></span>Model trust record</div>
          <p>TE-13 evidence changes sampling intensity, not write authority.</p>
        </div>
        <div class="node authority supervisor">
          <div class="label"><span class="dot"></span>Trusted orchestrator</div>
          <p>Samples, classifies signals, and escalates uncertain or violating work.</p>
        </div>

        <span class="edge-label l-edit">edit files</span>
        <span class="edge-label l-submit">submit evidence</span>
        <span class="edge-label l-record">approved result</span>
        <span class="edge-label l-push">push</span>
        <span class="edge-label l-detect">detect</span>
        <span class="edge-label l-hold">fail closed</span>
        <span class="edge-label l-sample">sampling policy</span>
      </div>
    </div>
    <ul class="legend">
      <li><i class="exec-line"></i>Execution</li>
      <li><i class="authority-line"></i>Authority</li>
      <li><i class="signal-line"></i>Violation and quarantine signal</li>
    </ul>
    <figcaption><b>Agent-fencing invariant.</b> The normal path ends with a platform-owned commit and push. Any worker history mutation leaves the normal path and enters quarantine. Model trust only controls how often the orchestrator looks for weaker signals.</figcaption>
  </figure>

  <footer>
    Text companion: <a href="agent-fencing.html">Agent fencing: the platform owns Git history</a>.
  </footer>
</main>
<script>
const root = document.documentElement;
const toggle = document.getElementById('theme-toggle');
toggle.addEventListener('click', () => {
  const darkNow = root.dataset.theme === 'dark' ||
    (!root.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
  root.dataset.theme = darkNow ? 'light' : 'dark';
});
</script>
</body>
</html>
