name: Backend CI (Linux)

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'backend.Tests/**'
      - 'agent-taskboard.sln'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'backend.Tests/**'
      - 'agent-taskboard.sln'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-test:
    name: dotnet build + test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore agent-taskboard.sln

      - name: Build
        run: dotnet build agent-taskboard.sln --no-restore -warnaserror:false

      # Linux is the future runner platform (ADR-0059 / remote-ready kickoff).
      # This job is the canary for path/PTY/process assumptions that only
      # surface off Windows. Phase-1 baseline (2026-07-07): the suite had 23
      # known Linux failures. Classification + remediation (task RM-1/AGT-1935):
      #   - Machine-bound live-checkout drift scans (5): tagged
      #     Category=MachineBound and excluded here (they assert facts about the
      #     on-disk checkout, not a hermetic fixture).
      #   - Update Service integration suite (8): Windows-native same-disk deploy
      #     machinery (stop/start + npm install); skipped on non-Windows until
      #     the Linux deploy story lands (kickoff D6).
      #   - ProjectRepoResolution path-derivation (3): fixed cross-platform.
      #   - MergeEndpoints (3): fixed — the failures were the X-Client-Id write
      #     boundary (ClientIdentityMiddleware), not a path assumption.
      # Full verification run 2026-07-08 (Windows host, Category!=MachineBound):
      # 3312 passed / 12 skipped / 8 failed. All four target clusters above pass;
      # the 8 residual failures are NOT Linux path issues (they fail on Windows
      # too) and are OUT OF SCOPE for this classification task — pre-existing
      # product/test drift that must be fixed before the gate can go sharp:
      #   - 2 flaky under load, green in isolation: ReorderJobsPerf,
      #     TaskFileHistoryEndpoints (Serilog "logger already frozen" ordering).
      #   - 6 deterministic: ClaudeEventAdapter (five_hour vs 5-hour string
      #     drift), CodePatternRuleLoader (docs-rule merge), FilesystemLayer /
      #     SteeringDocsSummaryDrift (repo-content asserts), ProjectChatMigration
      #     (perf budget), TaskFolderAccessIsolation (Directory.Delete governance
      #     guard). Track these as their own fix-ups.
      # continue-on-error STAYS until those residuals are cleared and a real
      # Linux run is confirmed green (any Linux-only path singles surface only
      # off-Windows); only then drop it to make the gate sharp.
      - name: Test
        continue-on-error: true
        run: dotnet test agent-taskboard.sln --no-build --filter "Category!=MachineBound" --logger "console;verbosity=minimal"
