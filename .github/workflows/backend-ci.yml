name: Backend CI (Linux)

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'backend.Tests/**'
      - 'agent-taskboard.sln'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'backend.Tests/**'
      - 'agent-taskboard.sln'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-test:
    name: dotnet build + test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore agent-taskboard.sln

      - name: Build
        run: dotnet build agent-taskboard.sln --no-restore -warnaserror:false

      # Linux is the future runner platform (ADR-0059 / remote-ready kickoff).
      # This job is the canary for path/PTY/process assumptions that only
      # surface off Windows. Phase-1 baseline (2026-07-07): the suite had 23
      # known Linux failures. Classification + remediation (task RM-1/AGT-1935):
      #   - Machine-bound live-checkout drift scans (5): tagged
      #     Category=MachineBound and excluded here (they assert facts about the
      #     on-disk checkout, not a hermetic fixture).
      #   - Update Service integration suite (8): Windows-native same-disk deploy
      #     machinery (stop/start + npm install); skipped on non-Windows until
      #     the Linux deploy story lands (kickoff D6).
      #   - ProjectRepoResolution path-derivation (3): fixed cross-platform.
      #   - MergeEndpoints (3): fixed — the failures were the X-Client-Id write
      #     boundary (ClientIdentityMiddleware), not a path assumption.
      # Full verification run 2026-07-08 (Windows host, Category!=MachineBound):
      # 3360 passed / 13 skipped / 10 failed (11m25s). All four target clusters
      # above pass; the 10 residual failures are NOT Linux path issues (they fail
      # on Windows too) and are OUT OF SCOPE for this classification task —
      # pre-existing product/test drift that must be fixed before the gate can go
      # sharp. Re-ran all 10 single-threaded to split flake vs. deterministic:
      #   - 3 flaky under parallel load, green in isolation: ReorderJobsPerf,
      #     TaskBatchMove, UpdateService AutoRollback (90s file-wait timeout).
      #   - 7 deterministic: ClaudeEventAdapter (five_hour vs 5-hour string
      #     drift), CodePatternRuleLoader (docs-rule merge), FilesystemLayer /
      #     SteeringDocsSummaryDrift (repo-content asserts), LaneMutexRegistry
      #     (concurrency invariant), ProjectChatMigration (perf budget),
      #     TaskFolderAccessIsolation (Directory.Delete governance guard). Track
      #     these as their own fix-ups.
      # Real Linux verification 2026-07-09 (Ubuntu 24.04, agent-runner, against
      # develop @ ad50bb1d which contains this task's trait/skip changes, same
      # Category!=MachineBound filter): Passed 3404 / Skipped 30 / Failed 9
      # (1m07s). This closes the off-Windows gap: the MachineBound exclusion and
      # the non-Windows Skip.If on the UpdateService suite fired as designed
      # (skips rose 13→30), and NONE of the four target clusters
      # (ProjectRepoResolution, MergeEndpoints, UpdateService path tests,
      # AgainstLiveDevCheckout) failed — no Linux-only path "singles" surfaced.
      # The 9 Linux failures are the same out-of-scope pre-existing residuals
      # enumerated above (the deterministic set; load flakes that need a
      # saturated run don't reproduce in Linux's fast 1m07s pass), not path
      # assumptions this task owns.
      # DECISION (final, no longer deferred): continue-on-error STAYS. With 9
      # out-of-scope residuals still failing on Linux the canary is not green, so
      # dropping the flag now would turn the gate red on every push for reasons
      # outside this classification task. Make the gate sharp only once those
      # residuals are cleared in their own fix-ups and a Linux run reports 0
      # failures.
      - name: Test
        continue-on-error: true
        run: dotnet test agent-taskboard.sln --no-build --filter "Category!=MachineBound" --logger "console;verbosity=minimal"
