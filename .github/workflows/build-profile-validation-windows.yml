name: Build profile validation (Windows)

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'backend/**'
      - 'backend.Tests/**'
      - 'task-server/**'
      - 'studio-bff/**'
      - 'testsupport/scenario/**'
      - 'scripts/scenario*'
      - '.github/workflows/build-profile-validation-windows.yml'
  workflow_dispatch:

jobs:
  build-profile-validation:
    name: Host-native dotnet profile
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate host-native shell and retained pickup state
        run: >-
          dotnet test backend.Tests/OrchestratorApi.Tests.csproj
          --filter "FullyQualifiedName=AgentStudio.Tests.BuildProfileValidationServiceTests.DotnetProfile_UsesHostShell_ValidatesGreenAndAllowsPickup|FullyQualifiedName=AgentStudio.Tests.ProjectSettingsServiceTests.ChangingOnlyTestFilter_PreservesPipelineReadyValidation"
          --logger "console;verbosity=normal"

      - name: Run deployment card smoke profile
        shell: bash
        env:
          JOB_RESULTS_DIR: ${{ runner.temp }}/deployment-scenario
        run: scripts/scenario.sh --target inproc --level smoke

      - name: Attach deployment scenario report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-scenario-build-profile-windows
          path: ${{ runner.temp }}/deployment-scenario
          if-no-files-found: error
