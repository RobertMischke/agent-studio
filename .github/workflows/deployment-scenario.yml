name: Deployment scenario

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inproc-smoke:
    name: In-process smoke twice (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run two consecutive green smoke scenarios
        shell: bash
        env:
          JOB_RESULTS_DIR: ${{ runner.temp }}/deployment-scenario-results
        run: |
          scripts/scenario.sh --target inproc --level smoke --output "$JOB_RESULTS_DIR/run-1"
          scripts/scenario.sh --target inproc --level smoke --output "$JOB_RESULTS_DIR/run-2"

      - name: Attach deployment scenario reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-scenario-inproc-${{ matrix.os }}
          path: ${{ runner.temp }}/deployment-scenario-results
          if-no-files-found: error
