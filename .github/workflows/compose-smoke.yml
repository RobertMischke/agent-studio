name: Onboarding smoke

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Docker Compose up and health check
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record Docker versions
        run: |
          docker version
          docker compose version

      - name: Build, start, and verify onboarding stack
        env:
          JOB_RESULTS_DIR: ${{ runner.temp }}/deployment-scenario-results
        run: scripts/compose-smoke-test.sh

      - name: Attach deployment scenario report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-scenario-compose-smoke
          path: ${{ runner.temp }}/deployment-scenario-results
          if-no-files-found: error
