name: Onboarding smoke

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Docker Compose up and health check
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record Docker versions
        run: |
          docker version
          docker compose version

      - name: Run deployment scenario card gate
        run: scripts/scenario.sh --target inproc --level smoke --output "$RUNNER_TEMP/deployment-scenario-inproc"

      - name: Build, start, and verify onboarding stack
        run: scripts/compose-smoke-test.sh

      - name: Upload deployment scenario reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-scenario-smoke
          path: |
            ${{ runner.temp }}/deployment-scenario-inproc/**
            scenario-results/**
          if-no-files-found: error
