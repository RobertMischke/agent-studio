# Agent Studio - container-default stack.
#
# Default (no profile):    orchestrator API + frontend  -> a working Studio.
# --profile runner:        adds coding/review agent-hosts (needs runner.env
#                          with identity, auth token, and git remotes; the
#                          coding CLIs run INSIDE these containers - the
#                          container is the isolation boundary).
# --profile distributed:   target-architecture preview (task-server, engine,
#                          studio-bff) - not required for a working install.
name: agent-studio

services:
  orchestrator-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STUDIO_API_PORT:-5031}:5031"
    volumes:
      - workspace:/data/workspace
      - projects:/data/projects
    environment:
      TaskRepository: /data/workspace
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5031/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      orchestrator-api:
        condition: service_healthy
    ports:
      - "${STUDIO_UI_PORT:-4011}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  agent-host-coding:
    build:
      context: .
      dockerfile: ${RUNNER_DOCKERFILE:-runner/Dockerfile}
    profiles: ["runner"]
    restart: unless-stopped
    depends_on:
      - orchestrator-api
    env_file:
      - path: ${RUNNER_ENV_FILE:-./runner.env}
        required: true
    environment:
      RUNNER_SERVER_URL: ${RUNNER_SERVER_URL:-http://orchestrator-api:5031}
      RUNNER_ROLE: coding
      RUNNER_ID: ${RUNNER_CODING_ID:-}
      RUNNER_NAME: ${RUNNER_CODING_NAME:-}
      RUNNER_HOSTNAME: ${RUNNER_CODING_HOSTNAME:-}
      # Compose-internal network: plain HTTP is an explicit, contained opt-in.
      RUNNER_ALLOW_INSECURE_HTTP: "1"
      RUNNER_AUTH_TOKEN_FILE: /run/secrets/runner.token
    volumes:
      - runner-coding:/var/lib/agent-host
      - ${RUNNER_TOKEN_FILE:-./runner.token}:/run/secrets/runner.token:ro

  agent-host-review:
    build:
      context: .
      dockerfile: ${RUNNER_DOCKERFILE:-runner/Dockerfile}
    profiles: ["runner"]
    restart: unless-stopped
    depends_on:
      - orchestrator-api
    env_file:
      - path: ${RUNNER_ENV_FILE:-./runner.env}
        required: true
    environment:
      RUNNER_SERVER_URL: ${RUNNER_SERVER_URL:-http://orchestrator-api:5031}
      RUNNER_ROLE: review
      RUNNER_ID: ${RUNNER_REVIEW_ID:-}
      RUNNER_NAME: ${RUNNER_REVIEW_NAME:-}
      RUNNER_HOSTNAME: ${RUNNER_REVIEW_HOSTNAME:-}
      RUNNER_ALLOW_INSECURE_HTTP: "1"
      RUNNER_AUTH_TOKEN_FILE: /run/secrets/runner.token
    volumes:
      - runner-review:/var/lib/agent-host
      - ${RUNNER_TOKEN_FILE:-./runner.token}:/run/secrets/runner.token:ro

  task-server:
    build:
      context: .
      dockerfile: task-server/Dockerfile
    profiles: ["distributed"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STUDIO_TASKSERVER_PORT:-5071}:5071"
    volumes:
      - orchestrator-data:/var/lib/agent-orchestrator
    environment:
      # The distributed service is reachable on the Compose network, so the
      # Task Server's non-loopback contract requires authentication.
      AUTH: bearer
      AUTH_TOKEN: ${TASK_SERVER_AUTH_TOKEN:-compose-local-task-server-token-000001}
      AllowedHosts: "*"

  orchestrator-engine:
    build:
      context: .
      dockerfile: orchestrator-engine/Dockerfile
    profiles: ["distributed"]
    restart: unless-stopped
    depends_on:
      - task-server

  studio-bff:
    build:
      context: .
      dockerfile: studio-bff/Dockerfile
    profiles: ["distributed"]
    restart: unless-stopped
    depends_on:
      - task-server
    ports:
      - "127.0.0.1:${STUDIO_BFF_PORT:-5072}:5072"
    environment:
      TaskServer__BaseUrl: http://task-server:5071
      TaskServer__AuthToken: ${TASK_SERVER_AUTH_TOKEN:-compose-local-task-server-token-000001}

volumes:
  workspace:
  projects:
  runner-coding:
  runner-review:
  orchestrator-data:
