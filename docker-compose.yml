# Agent Studio - container-default stack.
#
# Default (no profile):    orchestrator API + frontend  -> a working Studio.
# --profile runner:        adds coding/review agent-hosts (needs runner.env
#                          with identity, auth token, and git remotes; the
#                          coding CLIs run INSIDE these containers - the
#                          container is the isolation boundary).
# --profile distributed:   target-architecture preview (task-server, engine,
#                          studio-bff) - not required for a working install.
name: agent-studio

services:
  orchestrator-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STUDIO_API_PORT:-5031}:5031"
    volumes:
      - workspace:/data/workspace
      - projects:/data/projects
    environment:
      TaskRepository: /data/workspace
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5031/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      orchestrator-api:
        condition: service_healthy
    ports:
      - "${STUDIO_UI_PORT:-4011}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  agent-host-coding:
    build:
      context: .
      dockerfile: runner/Dockerfile
    profiles: ["runner"]
    restart: unless-stopped
    depends_on:
      - orchestrator-api
    env_file:
      - path: ./runner.env
        required: true
    environment:
      RUNNER_SERVER_URL: http://orchestrator-api:5031
      RUNNER_ROLE: coding
      # Compose-internal network: plain HTTP is an explicit, contained opt-in.
      RUNNER_ALLOW_INSECURE_HTTP: "1"
      RUNNER_AUTH_TOKEN_FILE: /run/secrets/runner.token
    volumes:
      - runner-coding:/var/lib/agent-host
      - ./runner.token:/run/secrets/runner.token:ro

  agent-host-review:
    build:
      context: .
      dockerfile: runner/Dockerfile
    profiles: ["runner"]
    restart: unless-stopped
    depends_on:
      - orchestrator-api
    env_file:
      - path: ./runner.env
        required: true
    environment:
      RUNNER_SERVER_URL: http://orchestrator-api:5031
      RUNNER_ROLE: review
      RUNNER_ALLOW_INSECURE_HTTP: "1"
      RUNNER_AUTH_TOKEN_FILE: /run/secrets/runner.token
    volumes:
      - runner-review:/var/lib/agent-host
      - ./runner.token:/run/secrets/runner.token:ro

  task-server:
    build:
      context: .
      dockerfile: task-server/Dockerfile
    profiles: ["distributed"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STUDIO_TASKSERVER_PORT:-5071}:5071"
    volumes:
      - orchestrator-data:/var/lib/agent-orchestrator

  orchestrator-engine:
    build:
      context: .
      dockerfile: orchestrator-engine/Dockerfile
    profiles: ["distributed"]
    restart: unless-stopped
    depends_on:
      - task-server

  studio-bff:
    build:
      context: .
      dockerfile: studio-bff/Dockerfile
    profiles: ["distributed"]
    restart: unless-stopped
    depends_on:
      task-server:
        condition: service_started
    ports:
      - "127.0.0.1:${STUDIO_BFF_PORT:-5072}:5072"

  scenario-runner:
    build:
      context: .
      dockerfile: testsupport/scenario/Dockerfile
    profiles: ["scenario"]
    depends_on:
      studio-bff:
        condition: service_started
      frontend:
        condition: service_healthy
    environment:
      SCENARIO_TARGET: compose
      SCENARIO_BASE_URL: http://studio-bff:5072
      SCENARIO_UI_URL: http://frontend
      SCENARIO_RESULTS_DIR: /results
    volumes:
      - type: bind
        source: ${SCENARIO_RESULTS_DIR:-./results/deployment-scenario}
        target: /results

volumes:
  workspace:
  projects:
  runner-coding:
  runner-review:
  orchestrator-data:
