<div class="harness">
  <header class="harness__bar">
    <h1 class="harness__title">ASS-1734 — Epic inline-expand (real TaskCardComponent)</h1>
    <button type="button"
            class="harness__refresh"
            data-testid="harness-refresh"
            (click)="simulateRefresh()">
      Simulate poll refresh
    </button>
    <span class="harness__count" data-testid="harness-refresh-count">refreshes: {{ refreshCount() }}</span>
  </header>

  <div class="harness__stage">
    <app-task-card [job]="epic()" [epicSubTasks]="subTasks()"></app-task-card>
  </div>
</div>
