@if (activity(); as value) {
  <span class="activity"
        [class]="'activity--' + value.tone"
        [cacTooltip]="value.tooltip"
        data-testid="task-card-post-processing-activity"
        [attr.data-activity-state]="value.tone"
        role="status">
    <span class="activity__glyph" aria-hidden="true"></span>
    {{ value.label }}
  </span>
}
