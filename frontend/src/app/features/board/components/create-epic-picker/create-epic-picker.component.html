@if (visible()) {
  <label class="field">
    <span class="field__label">Parent epic</span>
    <select class="field__input"
            data-testid="create-parent-epic-select"
            [(ngModel)]="parentEpicId">
      <option value="">No parent epic</option>
      @for (epic of epics(); track epic.id) {
        <option [value]="epic.id">{{ epic.title }}</option>
      }
    </select>
  </label>
}
