<app-sidesheet title="CLI Usage"
               subtitle="Quota windows only. Sessions live in the Orchestrator window."
               testid="cli-usage-sheet"
               (close)="closed.emit()">
  <section class="seg">
    <button class="seg__head" type="button" (click)="toggleSegment('quota')">
      <span class="seg__chev">{{ isSegmentCollapsed('quota') ? '▶' : '▼' }}</span>
      <span class="seg__title">Quota</span>
      <span class="seg__hint">subscription limits</span>
    </button>
    @if (!isSegmentCollapsed('quota')) {
      <app-quota-strip />
    }
  </section>

  <section class="seg">
    <div class="sheet__detail-empty">
      Full CLI session inventory moved to <strong>Orchestrator → Sessions</strong> and loads only when opened.
    </div>
  </section>
</app-sidesheet>
