@switch (mode()) {
  @case ('overview') {
    @defer (on immediate) {
      <app-workbench-overview
        [projectName]="projectName()"
        (openWorkbench)="openWorkbench.emit($event)" />
    } @placeholder {
      <app-loading-surface kind="list" label="Loading overview…" />
    }
  }
  @case ('viewer') {
    @defer (on immediate) {
      @if (projectName(); as project) {
        @if (workbenchId(); as id) {
          <app-workbench-viewer
            [projectName]="project"
            [workbenchId]="id"
            (openWiki)="openWiki.emit($event)" />
        }
      }
    } @placeholder {
      <app-loading-surface kind="list" label="Loading document…" />
    }
  }
}
