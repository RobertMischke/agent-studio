@if (sections().length > 0) {
  <section class="whome" data-testid="wiki-home-links" aria-label="Kuratierte Einstiege">
    <header class="whome__head">
      <span class="whome__head-icon" aria-hidden="true">
        <app-studio-icon name="book" [size]="13"></app-studio-icon>
      </span>
      <h3 class="whome__title">Einstiege</h3>
    </header>
    <div class="whome__grid">
      @for (section of sections(); track section.title) {
        <article class="whome__section" [attr.data-testid]="'wiki-home-section-' + section.title">
          <h4 class="whome__section-title">{{ section.title }}</h4>
          <ul class="whome__list">
            @for (link of section.links; track link.relPath + link.label) {
              <li>
                @if (link.exists) {
                  <button class="whome__link" type="button"
                          [attr.data-testid]="'wiki-home-link-' + link.relPath"
                          (click)="onLinkClick(link)">
                    <span class="whome__label">{{ link.label }}</span>
                    @if (link.note) {
                      <span class="whome__note">{{ link.note }}</span>
                    }
                  </button>
                } @else {
                  <span class="whome__link whome__link--missing"
                        [attr.data-testid]="'wiki-home-link-' + link.relPath"
                        cacTooltip="Seite nicht gefunden">
                    <span class="whome__label">{{ link.label }}</span>
                    @if (link.note) {
                      <span class="whome__note">{{ link.note }}</span>
                    }
                  </span>
                }
              </li>
            }
          </ul>
        </article>
      }
    </div>
  </section>
}
