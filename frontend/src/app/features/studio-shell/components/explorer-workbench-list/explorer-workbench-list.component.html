<app-tree-row level="child" glyph="eye" label="Workbenches"
              [chevron]="expanded() ? 'expanded' : 'collapsed'"
              [count]="catalogue()?.count ?? null"
              [active]="overviewActive()"
              [ariaCurrent]="overviewActive() ? 'page' : null"
              [testid]="'studio-explorer-project-workbenches-' + projectName()"
              (chevronClick)="toggle()" (selectRequest)="openOverviewPage()" />
@if (expanded()) {
  <div class="studio-workbench-topics" [attr.data-testid]="'studio-explorer-workbench-list-' + projectName()">
    @if (loading()) {
      <span class="studio-workbench-topics__state">Loading…</span>
    } @else {
      @for (workbench of catalogue()?.items ?? []; track workbench.id) {
        <button #workbenchTopic type="button" class="studio-workbench-topic"
                [class.studio-workbench-topic--active]="isActive(workbench)"
                [disabled]="!workbench.valid"
                [attr.aria-current]="isActive(workbench) ? 'page' : null"
                [attr.aria-label]="workbench.title + ', ' + accessibleMeta(workbench)"
                [attr.data-testid]="'studio-explorer-workbench-' + projectName() + '-' + workbench.id"
                (click)="openWorkbench.emit(workbench)">
          <span class="studio-workbench-topic__title">{{ workbench.title }}</span>
          <span class="studio-workbench-topic__meta">
            @if (isAcute(workbench)) { <i [attr.data-status]="workbench.status"></i> }
            {{ secondaryMeta(workbench) }}
            @if (openCount(workbench) > 0) { <strong>{{ openCount(workbench) }} open</strong> }
          </span>
        </button>
      } @empty { <span class="studio-workbench-topics__state">No open Workbenches</span> }
      <button type="button" class="studio-workbench-history"
              [attr.data-testid]="'studio-explorer-workbench-wiki-' + projectName()"
              (click)="openWiki.emit()">
        Open wiki →
      </button>
      <button type="button" class="studio-workbench-history" [attr.aria-expanded]="historyOpen()"
              [attr.data-testid]="'studio-explorer-workbench-history-' + projectName()" (click)="toggleHistory()">
        {{ historyOpen() ? 'Hide history' : 'History' }}
      </button>
      @if (historyOpen()) {
        <div class="studio-workbench-history__items">
          @for (workbench of settledHistory(); track workbench.id) {
            <button #workbenchTopic type="button" class="studio-workbench-topic studio-workbench-topic--settled"
                    [class.studio-workbench-topic--active]="isActive(workbench)"
                    [attr.aria-current]="isActive(workbench) ? 'page' : null"
                    [attr.aria-label]="workbench.title + ', ' + accessibleMeta(workbench)"
                    [attr.data-testid]="'studio-explorer-workbench-' + projectName() + '-' + workbench.id"
                    (click)="openWorkbench.emit(workbench)">
              <span class="studio-workbench-topic__title">{{ workbench.title }}</span>
              <span class="studio-workbench-topic__meta">{{ secondaryMeta(workbench) }}</span>
            </button>
          } @empty { <span class="studio-workbench-topics__state">No settled Workbenches</span> }
        </div>
      }
    }
  </div>
}
