@for (group of groups(); track group.status) {
  <div
    class="studio-workbench-history__items"
    [attr.data-testid]="'studio-explorer-workbench-' + group.status + '-history'"
  >
    <span class="studio-workbench-history__label">{{ group.label }}</span>
    @for (workbench of group.items; track workbench.id) {
      <button
        #workbenchTopic
        type="button"
        class="studio-workbench-topic"
        [class.studio-workbench-topic--active]="isActive(workbench)"
        [attr.aria-current]="isActive(workbench) ? 'page' : null"
        [attr.aria-label]="workbench.title + ', ' + secondaryMeta(workbench)"
        [appTooltip]="tooltip(workbench)"
        [attr.data-testid]="'studio-explorer-workbench-' + projectName() + '-' + workbench.id"
        (click)="openWorkbench.emit(workbench)"
      >
        <span class="studio-workbench-topic__primary">
          <span class="studio-workbench-topic__pattern"
                aria-hidden="true"
                [attr.data-pattern]="documentPattern(workbench)">
            <app-studio-icon [name]="patternIcon(workbench)" [size]="12" />
          </span>
          <span class="studio-workbench-topic__title">{{ workbench.title }}</span>
        </span>
        <span class="studio-workbench-topic__meta">
          <i class="studio-workbench-status-dot" aria-hidden="true"
             [attr.data-status]="workbench.status"
             [attr.data-testid]="'studio-explorer-workbench-status-' + projectName() + '-' + workbench.id"></i>
          @if (workbench.key; as key) {
            <span class="studio-workbench-topic__key"
                  [attr.data-testid]="'studio-explorer-workbench-key-' + projectName() + '-' + workbench.id">{{ key }}</span>
          }
          <span>{{ secondaryMeta(workbench) }}</span>
        </span>
      </button>
    } @empty {
      <span class="studio-workbench-topics__state">{{ group.empty }}</span>
    }
  </div>
}
