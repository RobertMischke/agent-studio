@for (group of groups(); track group.status) {
  <div
    class="studio-workbench-history__items"
    [attr.data-testid]="'studio-explorer-workbench-' + group.status + '-history'"
  >
    <span class="studio-workbench-history__label">{{ group.label }}</span>
    @for (workbench of group.items; track workbench.id) {
      <span #workbenchTopic class="studio-workbench-history__topic-host">
        <app-tree-row class="studio-workbench-history__entry-row"
          level="child"
          [glyph]="patternIcon(workbench)"
          [label]="workbench.title"
          [active]="isActive(workbench)"
          [ariaCurrent]="isActive(workbench) ? 'page' : null"
          [ariaLabel]="workbench.title + ', ' + secondaryMeta(workbench)"
          [tooltip]="tooltip(workbench)"
          [tooltipTestId]="'studio-explorer-workbench-tooltip-' + projectName() + '-' + workbench.id"
          [testid]="'studio-explorer-workbench-' + projectName() + '-' + workbench.id"
          (selectRequest)="openWorkbench.emit(workbench)">
          <i class="studio-workbench-status-dot" aria-hidden="true"
             [attr.data-status]="workbench.status"
             [attr.data-testid]="'studio-explorer-workbench-status-' + projectName() + '-' + workbench.id"></i>
        </app-tree-row>
      </span>
    } @empty {
      <span class="studio-workbench-topics__state">{{ group.empty }}</span>
    }
  </div>
}
