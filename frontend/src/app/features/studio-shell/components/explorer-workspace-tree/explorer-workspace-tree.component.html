<section class="studio-explorer-tree">
  <!-- Panel section header (F27 testid preserved): collapses the whole
       tree and hosts the "show all projects" affordance. -->
  <app-section-header
    [collapsible]="true"
    [collapsed]="isCollapsed('workspace')"
    title="Workspaces"
    [count]="totalProjectCount()"
    testid="studio-explorer-workspace-head"
    (collapsedChange)="setCollapsed('workspace', $event)">
    <button actions
            type="button"
            class="studio-sidebar__action studio-sidebar__action--inline"
            [class.studio-sidebar__action--active]="showAllActive()"
            data-testid="studio-explorer-show-all-projects"
            appTooltip="Show all projects (open the cross-project board)"
            aria-label="Show all projects"
            (click)="showAll.emit(); $event.stopPropagation()">
      <app-studio-icon name="grid" [size]="11"></app-studio-icon>
    </button>
  </app-section-header>

  @if (!isCollapsed('workspace')) {
    @for (g of groups(); track g.id) {
      <!-- F46: workspace level — one collapsible folder per registry
           workspace; the projects below it are the second tree level.
           Double-clicking a real workspace header opens an inline rename. -->
      @if (renamingWsId() === g.id) {
        <div class="studio-explorer-tree__ws-rename">
          <input #wsRenameInput
                 type="text"
                 class="studio-explorer-tree__ws-rename-input"
                 [attr.data-testid]="'studio-explorer-ws-rename-input-' + g.id"
                 [value]="renameDraft()"
                 (input)="renameDraft.set($any($event.target).value)"
                 (keydown)="onRenameKeydown($event)"
                 (blur)="commitRename()" />
        </div>
      } @else {
        <app-section-header
          class="studio-explorer-tree__ws-head"
          [collapsible]="true"
          [collapsed]="isCollapsed('ws:' + g.id)"
          [title]="g.displayName"
          [count]="g.projects.length"
          [testid]="'studio-explorer-ws-group-' + g.id"
          appTooltip="Double-click or right-click to rename this workspace"
          (collapsedChange)="onWsHeaderToggle(g)"
          (dblclick)="startRenameWorkspace(g)"
          (contextmenu)="openWsContextMenu($event, g)" />
      }

      @if (!isCollapsed('ws:' + g.id)) {
        @for (p of g.projects; track p.name) {
          <div class="studio-tree-project"
               draggable="true"
               [class.studio-tree-project--dragging]="projectDrag.draggingProjectName() === p.name"
               [class.studio-tree-project--drop-target]="projectDrag.dragOverProjectName() === p.name && canDrop(projectDrag.draggingProjectName(), p.name)"
               [class.studio-tree-project--drop-invalid]="!!projectDrag.draggingProjectName() && projectDrag.draggingProjectName() !== p.name && !canDrop(projectDrag.draggingProjectName(), p.name)"
               [class.studio-tree-project--moving]="projectDrag.movingProjectName() === p.name"
               [attr.data-project-name]="p.name"
               [attr.data-testid]="'studio-explorer-project-row-' + p.name"
               [appTooltip]="rowTitle(p.name)"
               (dragstart)="onDragStart($event, p.name)"
               (dragover)="onDragOver($event, p.name)"
               (dragleave)="onDragLeave(p.name)"
               (drop)="onDrop($event, p.name)"
               (dragend)="onDragEnd()">
            <!-- Label / chevron click toggles expand/collapse; double-click
                 opens the board; the inline icon opens the Project Hub. -->
            <app-tree-row level="root"
                          [chevron]="isExpanded(p.name) ? 'expanded' : 'collapsed'"
                          [glyphChar]="p.initial"
                          [glyphColor]="p.color"
                          [label]="p.name"
                          [count]="p.totalJobs"
                          [active]="p.isActive"
                          [testid]="'studio-explorer-project-' + p.name"
                          (chevronClick)="toggleExpanded.emit(p.name)"
                          (selectRequest)="toggleExpanded.emit(p.name)"
                          (secondary)="openBoardRequest.emit(p.name)">
              <button type="button"
                      class="studio-tree-row__hub-link"
                      appTooltip="Open Project Hub"
                      aria-label="Open Project Hub"
                      (click)="openHubRequest.emit(p.name); $event.stopPropagation()">
                <app-studio-icon name="grid" [size]="10"></app-studio-icon>
              </button>
            </app-tree-row>
            @if (isExpanded(p.name)) {
              <div class="studio-tree-children">
                <app-tree-row level="child" glyph="folder"
                              label="backlog"
                              [count]="p.lanes.backlog"
                              (selectRequest)="openBoardRequest.emit(p.name)" />
                <app-tree-row level="child" glyph="play"
                              label="active"
                              [count]="p.lanes.active"
                              (selectRequest)="openBoardRequest.emit(p.name)" />
                <app-tree-row level="child" glyph="eye"
                              label="human review"
                              [count]="p.lanes.review"
                              (selectRequest)="openBoardRequest.emit(p.name)" />
                <app-tree-row level="child" glyph="grid"
                              label="Project Hub"
                              (selectRequest)="openHubRequest.emit(p.name)" />
                <app-tree-row level="child" glyph="archive"
                              label="archive"
                              [count]="p.lanes.archive"
                              (selectRequest)="openBoardRequest.emit(p.name)" />
              </div>
            }
          </div>
        }
      }
    }
    @if (groups().length === 0) {
      <app-empty-state>No projects loaded</app-empty-state>
    }
  }

  <!-- Right-click "Rename" surface for workspace headers. Text-only menu
       (project convention: no icons in menu items); selecting it opens the
       same inline rename as the double-click path. -->
  <app-menu
    [open]="wsContextMenu() !== null"
    [items]="wsContextMenuItems()"
    [position]="wsContextMenuPosition()"
    testIdPrefix="studio-explorer-ws-ctx"
    ariaLabel="Workspace actions"
    (itemClick)="onWsContextMenuItemClick($event)"
    (closeRequest)="closeWsContextMenu()" />
</section>
