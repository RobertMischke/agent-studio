<span class="studio-auto-pulse"
      [class.studio-auto-pulse--idle]="state() === 'auto-idle'"
      [class.studio-auto-pulse--active]="state() === 'auto-active'"
      [class.studio-auto-pulse--aggregate]="aggregate()"
      [attr.data-testid]="testid()"
      [attr.data-pulse]="state()"
      [cacTooltip]="tooltip()"
      [attr.role]="state() === 'off' ? null : 'img'"
      [attr.aria-label]="ariaLabel() || null"></span>
