<aside class="studio-activitybar" data-testid="studio-activity-bar">
  <!-- Always-on Board button. The studio shell guarantees a sticky default
       board tab is mounted; clicking this button focuses that tab so the
       user can always get back to the kanban from any other view. Sits
       above the panel toggles so it reads as a first-class destination,
       not a sidebar toggle. -->
  <button type="button"
          class="studio-ab__btn studio-ab__btn--board"
          [class.studio-ab__btn--active]="boardActive()"
          appTooltip="Open board (Ctrl+B)"
          data-testid="studio-ab-board"
          (click)="openBoardRequest.emit()">
    <svg class="studio-ab__svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
      <rect x="3" y="4" width="5" height="16" rx="1" />
      <rect x="10" y="4" width="5" height="11" rx="1" />
      <rect x="17" y="4" width="4" height="7" rx="1" />
    </svg>
  </button>
  <!-- Dedicated backlog triage destination. Sister to the Board button; the
       triage screen (route #/backlog) opens via Ctrl+B as a toggle. The
       badge counts 0-backlog jobs under the active project filter. -->
  <button type="button"
          class="studio-ab__btn studio-ab__btn--backlog"
          [class.studio-ab__btn--active]="backlogActive()"
          appTooltip="Open backlog triage (Ctrl+B)"
          data-testid="studio-ab-backlog"
          (click)="openBacklogRequest.emit()">
    <span class="studio-ab__emoji" aria-hidden="true">📋</span>
    @if (backlogCount() > 0) {
      <span class="studio-ab__badge studio-ab__badge--count"
            data-testid="studio-ab-backlog-badge"
            [appTooltip]="backlogCount() + (backlogCount() === 1 ? ' backlog task' : ' backlog tasks')"
            aria-hidden="true">{{ backlogCount() }}</span>
    }
  </button>
  @for (item of items(); track item.key) {
    <button type="button"
            class="studio-ab__btn"
            [class.studio-ab__btn--active]="activePanel() === item.key && sidebarVisible()"
            [appTooltip]="item.label"
            [attr.data-panel]="item.key"
            [attr.data-testid]="'studio-ab-' + item.key"
            (click)="panelToggle.emit(item.key)">
      <svg class="studio-ab__svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true">
        @switch (item.icon) {
          @case ('folder') {
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          }
          @case ('filter') {
            <path d="M4 5h16l-6 8v6l-4 2v-8z" />
          }
          @case ('cli') {
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <polyline points="7 10 10 13 7 16" />
            <line x1="13" y1="16" x2="17" y2="16" />
          }
          @case ('activity') {
            <polyline points="4 12 8 12 11 5 13 19 16 12 20 12" />
          }
          @case ('runbook') {
            <circle cx="12" cy="12" r="8" />
            <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none" />
          }
        }
      </svg>
      @if (badgeCounts()[item.key]; as count) {
        <span class="studio-ab__badge"
              [appTooltip]="count + (count === 1 ? ' filter active' : ' filters active')"
              [attr.data-testid]="'studio-ab-badge-' + item.key"
              aria-hidden="true">{{ count }}</span>
      }
    </button>
  }
  <span class="studio-ab__spacer"></span>
  <button type="button"
          class="studio-ab__btn"
          [class.studio-ab__btn--active]="activePanel() === 'settings' && sidebarVisible()"
          appTooltip="Settings"
          data-testid="studio-ab-settings"
          (click)="panelToggle.emit('settings')">
    <svg class="studio-ab__svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
      <circle cx="12" cy="12" r="3" />
      <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1A2 2 0 1 1 4.3 17l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9 1.7 1.7 0 0 0 4.3 7.2L4.2 7A2 2 0 1 1 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1A2 2 0 1 1 19.7 7l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
    </svg>
  </button>
</aside>
