@if (epic(); as e) {
  <button type="button"
          class="epic-membership"
          data-testid="epic-membership-banner"
          [cacTooltip]="'Jump to epic ' + (e.key ? e.key + ' — ' : '') + e.title"
          (click)="openEpic.emit({ jobId: e.id, watchPath: e.watchPath })">
    <span class="epic-membership__label" aria-hidden="true">⬡ Epic</span>
    @if (e.key) {
      <span class="epic-membership__key" data-testid="epic-membership-key">{{ e.key }}</span>
    }
    <span class="epic-membership__title" data-testid="epic-membership-title">{{ e.title }}</span>
    <span class="epic-membership__go" aria-hidden="true">→</span>
  </button>
}
