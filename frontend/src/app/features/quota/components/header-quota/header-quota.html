<div class="hquota">
  @for (card of cards(); track card.cliType) {
    <div class="hquota__card"
         [attr.data-testid]="'hquota-card-' + card.cliType"
         [attr.aria-label]="card.ariaLabel"
         [class.hquota__card--error]="!!card.error"
         [class.hquota__card--stale]="card.stale"
         [attr.data-tone]="card.tone"
         [attr.data-state]="card.state"
         [appTooltip]="card.tooltip">
      <span class="hquota__icon" aria-hidden="true">{{ card.icon }}</span>
      <span class="hquota__label">{{ card.label }}</span>

      <span class="hquota__metric"
            [attr.data-testid]="'hquota-' + card.cliType + '-primary'"
            [attr.data-tone]="card.primary.tone">
        <span class="hquota__value">{{ card.primary.value }}</span>
        @if (card.primary.tag) {
          <span class="hquota__tag">{{ card.primary.tag }}</span>
        }
        <span class="hquota__bar"><span class="hquota__bar-fill" [style.width.%]="card.primary.barPct"></span></span>
      </span>

      @if (card.stale) {
        <span class="hquota__stale-dot" [appTooltip]="'Stale: snapshot is older than the cache TTL.'">●</span>
      }
    </div>
  }
</div>
