@if (entry(); as item) {
  <article class="feed-entry"
           role="button"
           tabindex="0"
           data-testid="orchestrator-feed-entry"
           [attr.data-project]="item.project || projectFallback()"
           [attr.data-entry-kind]="item.kind"
           [class.feed-entry--selected]="selected()"
           [class.feed-entry--alert]="item.kind === 'alert'"
           [class.feed-entry--decision]="item.kind === 'decision'"
           [class.feed-entry--action]="item.kind === 'action'"
           [class.feed-entry--observation]="item.kind === 'observation'"
           [class.feed-entry--intervention]="item.kind === 'intervention'"
           (click)="select()"
           (keydown.enter)="select()"
           (keydown.space)="select(); $event.preventDefault()">
    <div class="feed-entry__top">
      <span class="feed-entry__kind">{{ kindLabel(item.kind) }}</span>
      <span class="feed-entry__topic">{{ item.topic }}</span>
      <button type="button"
              class="feed-entry__project"
              data-testid="orchestrator-entry-project"
              [attr.aria-label]="'Filter activity to ' + (item.project || projectFallback())"
              [cacTooltip]="item.project || projectFallback()"
              (click)="filterProject($event, item.project || projectFallback())">
        <i [style.background]="projectColor(item.project || projectFallback())" aria-hidden="true"></i>
        <span>{{ projectCode(item.project || projectFallback()) }}</span>
      </button>
      <time class="feed-entry__time" [attr.datetime]="item.ts" [cacTooltip]="formatTime(item.ts)">{{ formatClock(item.ts) }}</time>
    </div>
    <span class="feed-entry__summary" data-testid="orchestrator-entry-summary">{{ item.summary }}</span>
    @if (item.jobId && item.watchPath) {
      <span class="feed-entry__task-row">
        <span>Task</span>
        <button type="button"
                class="feed-entry__task-link"
                (click)="openTask($event)"
                [attr.aria-label]="'Open task ' + item.jobId"
                data-testid="orchestrator-entry-task">{{ item.jobId }}</button>
      </span>
    }
    @if (item.tokenUsage; as usage) {
      <span class="feed-entry__tokens" [cacTooltip]="tokenTooltip()">{{ usage.model || '?' }} · ↑{{ usage.inputTokens }} ↓{{ usage.outputTokens }}</span>
    }
  </article>
}
