<aside class="rail" [class.rail--expanded]="expanded()" data-testid="chat-switcher-rail">
  <button type="button"
          class="rail__chip"
          [attr.aria-expanded]="expanded()"
          aria-controls="chat-switcher-groups"
          data-testid="chat-switcher-chip"
          (click)="expanded.set(!expanded())">
    <span class="rail__chip-glyph" aria-hidden="true">{{ expanded() ? '›' : '‹' }}</span>
    <span>{{ activeCount() }} active</span>
  </button>

  @if (expanded()) {
    <div id="chat-switcher-groups" class="rail__groups" data-testid="chat-switcher-groups">
      @for (group of [{ label: 'Global', rows: globalRows() }, { label: 'Projects', rows: projectRows() }, { label: 'Tasks', rows: taskRows() }]; track group.label) {
        @if (group.rows.length > 0) {
          <section class="rail__group">
            <h3>{{ group.label }}</h3>
            @for (row of group.rows; track row.contextKey) {
              <div class="rail__row"
                   [class.rail__row--active]="row.contextKey === activeContextKey()"
                   [attr.data-testid]="'chat-switcher-row-' + row.contextKey">
                <button type="button" class="rail__name" (click)="select(row.contextKey)">
                  <span class="rail__presence" [class.rail__presence--live]="row.runtimeStatus === 'active'" aria-hidden="true"></span>
                  <span class="rail__label">{{ row.label }}</span>
                  <span class="rail__badges">
                    @if (row.runtimeStatus === 'active') { <span class="rail__badge rail__badge--live">running</span> }
                    @if (row.runtimeStatus === 'queued') { <span class="rail__badge">queued {{ row.queuePosition }}</span> }
                    @if (row.runtimeStatus === 'parked') { <span class="rail__badge">parked</span> }
                    @if (unreadContextKeys().has(row.contextKey)) { <span class="rail__badge rail__badge--unread">new</span> }
                    @if (tokenLabel(row); as tokens) { <span class="rail__badge">{{ tokens }}</span> }
                  </span>
                </button>
                <button type="button" class="rail__navigate"
                        [attr.aria-label]="'Navigate to ' + row.label"
                        [attr.data-testid]="'chat-switcher-navigate-' + row.contextKey"
                        (click)="navigate(row.contextKey, $event)">→</button>
              </div>
            }
          </section>
        }
      }
    </div>
  }
</aside>
