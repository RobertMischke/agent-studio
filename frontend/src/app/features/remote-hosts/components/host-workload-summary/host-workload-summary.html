<section class="workloads" data-testid="remote-host-workloads" aria-label="Host workload classes">
  <div class="workloads__head">
    <strong>Host work</strong>
    <span>Process and event truth; lane/claim drift is not folded into these counts.</span>
  </div>
  <div class="workloads__grid">
    <article class="workload"
             [class.workload--stale]="runSlotsStale()"
             data-testid="remote-host-run-pool">
      <span class="workload__kind">RUN slots</span>
      <strong>
        {{ runSlots() }}
        @if (runSlotsDiverge()) {
          <span class="workload__warning"
                data-testid="remote-host-running-divergence"
                aria-label="Running sources disagree"
                [appTooltip]="runSlotsTooltip()">
            <app-studio-icon name="warn" [size]="12"></app-studio-icon>
          </span>
        }
      </strong>
      <small>Daemon telemetry · coding and agent runs</small>
    </article>
  </div>
</section>
