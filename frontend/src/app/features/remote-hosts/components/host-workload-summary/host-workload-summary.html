<section class="workloads" data-testid="remote-host-workloads" aria-label="Host workload">
  <div class="workloads__head">
    <strong>Host work</strong>
    <span>Daemon telemetry; lane/claim drift is shown separately.</span>
  </div>
  <div class="workloads__grid">
    <article class="workload"
             [class.workload--stale]="runSlotsStale()"
             data-testid="remote-host-run-pool">
      <span class="workload__kind">RUN slots</span>
      <strong>
        {{ runSlots() }}
        @if (runSlotsDiverge()) {
          <span class="workload__warning"
                data-testid="remote-host-running-divergence"
                aria-label="Running sources disagree"
                [appTooltip]="runSlotsTooltip()">
            <app-studio-icon name="warn" [size]="12"></app-studio-icon>
          </span>
        }
      </strong>
      <small>Coding and remote review processes</small>
    </article>
  </div>
  <p class="workloads__explain" data-testid="remote-host-cpu-context">
    CPU and host load can include other processes that are not represented by these slots.
  </p>
</section>
