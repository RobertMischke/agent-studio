<div class="uhp"
     data-testid="usage-hover-panel"
     role="button"
     tabindex="0"
     aria-label="Open CLI Management"
     (mouseenter)="onAnchorEnter()"
     (mouseleave)="onAnchorLeave()"
     (click)="activate($event)"
     (keydown)="onTriggerKeydown($event)">
  <app-header-quota />
</div>

@if (open()) {
  <div class="uhp__pop-wrap"
       data-testid="usage-hover-panel-pop"
       (mouseenter)="onPopEnter()"
       (mouseleave)="onPopLeave()">
    <app-cli-usage-mini-popover [rows]="quotaRows()" />
  </div>
}
