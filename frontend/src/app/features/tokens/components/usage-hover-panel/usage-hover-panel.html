<div class="uhp" data-testid="usage-hover-panel">
  <app-header-quota (cliSelected)="select($event)" />
</div>

@if (selectedCli(); as cli) {
  <app-cli-usage-modal
    [cliType]="cli"
    [row]="selectedRow()"
    [tokens]="tokens()"
    [adhoc]="adhoc()"
    [refreshing]="!!refreshing()[cli]"
    (closeRequest)="close()"
    (refresh)="refreshOne(cli)"
    (manageCaps)="manageCaps()" />
}
