<div class="cump" data-testid="cli-usage-mini-popover">
  @if (rows().length === 0) {
    <p class="cump__empty" data-testid="cli-usage-mini-empty">No quota data yet.</p>
  } @else {
    @for (row of rows(); track row.cliType) {
      <div class="cump__row"
           [attr.data-tone]="row.primaryTone"
           [attr.data-testid]="'cli-usage-mini-row-' + row.cliType">
        <div class="cump__head">
          <span class="cump__icon" aria-hidden="true">{{ row.icon }}</span>
          <strong class="cump__label">{{ row.label }}</strong>
          <span class="cump__pct">{{ row.primaryPct === null ? '—' : row.primaryPct + '%' }}</span>
        </div>
        <div class="cump__meter" aria-hidden="true">
          <span [style.width.%]="row.primaryPct === null ? 0 : row.primaryPct"></span>
        </div>
        <div class="cump__sub">
          <span>{{ headroom(row) }}</span>
          <span class="cump__window">{{ windowLine(row) }}</span>
        </div>
      </div>
    }
  }
  <p class="cump__hint" data-testid="cli-usage-mini-hint">Click for full detail in CLI Management</p>
</div>
