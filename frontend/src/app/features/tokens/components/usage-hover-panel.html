<div class="uhp"
     data-testid="usage-hover-panel"
     role="button"
     tabindex="0"
     aria-label="Open CLI usage detail"
     (click)="openPanel($event)"
     (keydown)="onTriggerKeydown($event)">
  <app-header-quota />
</div>

@if (open()) {
  @defer (when open()) {
    <app-cli-usage-detail-modal
      [quotaRows]="quotaRows()"
      [tokens]="tokens()"
      [adhoc]="adhoc()"
      [timeline24h]="timeline24h()"
      [timeline7d]="timeline7d()"
      [expensiveJobs]="expensiveJobs()"
      [refreshing]="refreshing()"
      [refreshingAll]="refreshingAll()"
      (closed)="closePanel()"
      (refreshAll)="refreshAll($event)"
      (refreshOne)="refreshOneFromModal($event)" />
  }
}
