@if (visible()) {
  <span class="project-hygiene-badge"
        [class.project-hygiene-badge--dirty]="isDirty()"
        [class.project-hygiene-badge--unpushed]="!isDirty() && isAhead()"
        [appTooltip]="tooltip()"
        data-testid="project-hygiene-badge">
    @if (isDirty()) {
      ⚠ dirty
    } @else if (isAhead()) {
      ↑ {{ aheadCount() }} unpushed
    }
  </span>
}
