<div class="detail__panes-toolbar detail__panes-toolbar--icons">
  <button class="pane-toggle"
          [class.pane-toggle--active]="panesVisible().prompt"
          (click)="toggleRequest.emit('prompt')"
          data-testid="pane-toggle-prompt"
          aria-label="Toggle Task pane"
          [appTooltip]="'Task description'">📝</button>
  <button class="pane-toggle"
          [class.pane-toggle--active]="panesVisible().protocol"
          (click)="toggleRequest.emit('protocol')"
          data-testid="pane-toggle-protocol"
          aria-label="Toggle Protocol pane"
          [appTooltip]="'Protocol &amp; chat'">🤖</button>
  <button class="pane-toggle"
          [class.pane-toggle--active]="panesVisible().git"
          (click)="toggleRequest.emit('git')"
          data-testid="pane-toggle-git"
          aria-label="Toggle Git pane"
          [appTooltip]="'Git diff &amp; file tree'">🌿</button>
  <span class="detail__panes-toolbar-spacer"></span>
  <button class="pane-toggle"
          (click)="openInVsCode.emit()"
          data-testid="open-in-vscode"
          aria-label="Open project in VS Code"
          [appTooltip]="'Open the project root in VS Code (-r reuses an existing window).'">🪟</button>
</div>
