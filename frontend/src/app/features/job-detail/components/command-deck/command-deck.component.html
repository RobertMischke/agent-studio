<div class="commandbar"
     [class.commandbar--collapsed]="collapsed()"
     data-testid="commandbar">
  @if (collapsed()) {
    <span class="commandbar__status" data-testid="commandbar-running">
      <span class="commandbar__pulse"></span>
      <span class="commandbar__status-text">Running · {{ elapsedTime() }}</span>
    </span>
    <span class="commandbar__compact-meta">
      <span class="commandbar__chip">{{ cliTypeLabel(cliTypeDraft()) }}</span>
      @if (modelDraft(); as m) {
        <span class="commandbar__chip commandbar__chip--muted">{{ m }}</span>
      }
    </span>
    <span class="commandbar__spacer"></span>
    <button type="button"
            class="commandbar__toggle"
            data-testid="commandbar-show-setup"
            (click)="toggleCollapsed.emit()">
      Show setup
    </button>
    <button class="btn-exec btn-exec--stop commandbar__action" (click)="stopRequest.emit()">⏹ Stop</button>
  } @else {
    <!--
      Compressed Project chip: the text "Project" label is dropped from
      the visible chrome (the dropdown chevron is enough of a cue) and
      lives on aria-label/title for screen readers + hover. -->
    <label class="commandbar__field commandbar__field--chip commandbar__field--project">
      <span class="commandbar__label commandbar__label--sr" aria-hidden="false">Project</span>
      <select class="commandbar__select commandbar__select--chip"
              aria-label="Project"
              [appTooltip]="'Project'"
              data-testid="commandbar-project"
              [ngModel]="currentWatchPath()"
              (ngModelChange)="projectChange.emit($event)">
        @for (wp of watchPaths(); track wp.path) {
          <option [value]="wp.path">{{ wp.name }}</option>
        }
      </select>
    </label>

    <div class="commandbar__cli" role="tablist" [attr.aria-label]="'CLI'">
      @for (t of cliTypes; track t) {
        <button type="button"
                class="commandbar__cli-btn"
                [class.commandbar__cli-btn--active]="cliTypeDraft() === t"
                [disabled]="isRunning()"
                [appTooltip]="cliTypeLabel(t)"
                [attr.aria-label]="cliTypeLabel(t)"
                (click)="cliTypeChange.emit(t)">
          <span class="commandbar__cli-icon" aria-hidden="true">{{ cliTypeIcon(t) }}</span>
          <span class="commandbar__cli-text">{{ cliTypeLabel(t) }}</span>
        </button>
      }
    </div>

    <!-- Compressed Model chip (same shape as Project). -->
    <label class="commandbar__field commandbar__field--chip commandbar__field--grow">
      <span class="commandbar__label commandbar__label--sr" aria-hidden="false">Model</span>
      <select id="job-model"
              class="commandbar__select commandbar__select--chip"
              aria-label="Model"
              [appTooltip]="'Model'"
              data-testid="commandbar-model"
              [ngModel]="modelDraft()"
              [disabled]="isRunning()"
              (ngModelChange)="modelChange.emit($event)">
        <option value="">(default)</option>
        @for (m of availableModels(); track m.id) {
          <option [value]="m.id">{{ m.label }}{{ m.multiplier !== null && m.multiplier !== undefined ? ' — ' + formatMultiplier(m.multiplier) : '' }}{{ m.isDefault ? ' ✓' : '' }}</option>
        }
      </select>
    </label>

    @if (isRunning()) {
      <span class="commandbar__status" data-testid="commandbar-running">
        <span class="commandbar__pulse"></span>
        <span class="commandbar__status-text">{{ elapsedTime() }}</span>
      </span>
      <button type="button"
              class="commandbar__toggle"
              data-testid="commandbar-hide-setup"
              (click)="toggleCollapsed.emit()">
        Hide setup
      </button>
      <button class="btn-exec btn-exec--stop commandbar__action" (click)="stopRequest.emit()">⏹ Stop</button>
    } @else if (canStart()) {
      <button class="btn-exec btn-exec--start commandbar__action"
              data-testid="command-deck-start"
              (click)="startRequest.emit()"
              [disabled]="starting() || !!startDisabledReason()"
              [appTooltip]="startDisabledReason()">
        {{ starting() ? '⏳' : '▶ Start' }}
      </button>
      @if (startDisabledReason()) {
        <span class="commandbar__disabled-reason" data-testid="command-deck-start-disabled-reason">
          {{ startDisabledReason() }}
        </span>
      }
    }
  }
</div>
