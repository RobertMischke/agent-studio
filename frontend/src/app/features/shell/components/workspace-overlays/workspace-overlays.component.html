@if (overlays.tokensOpen()) {
  <div class="overlay" data-testid="workspace-tokens-overlay" (click)="overlays.closeTokens()" tabindex="0" (keydown.enter)="overlays.closeTokens()" (keydown.space)="overlays.closeTokens(); $event.preventDefault()">
    <div class="overlay__panel overlay__panel--wtt" (click)="$event.stopPropagation()" tabindex="0" (keydown.enter)="$event.stopPropagation()" (keydown.space)="$event.stopPropagation(); $event.preventDefault()">
      <button class="overlay__close" (click)="overlays.closeTokens()" [appTooltip]="'Close'">×</button>
      <app-workspace-token-timeline />
    </div>
  </div>
}

@if (overlays.screenshotsOpen()) {
  <div class="overlay" data-testid="workspace-screenshots-overlay" (click)="overlays.closeScreenshots()" tabindex="0" (keydown.enter)="overlays.closeScreenshots()" (keydown.space)="overlays.closeScreenshots(); $event.preventDefault()">
    <div class="overlay__panel overlay__panel--wtt" (click)="$event.stopPropagation()" tabindex="0" (keydown.enter)="$event.stopPropagation()" (keydown.space)="$event.stopPropagation(); $event.preventDefault()">
      <button class="overlay__close" (click)="overlays.closeScreenshots()" [appTooltip]="'Close'">×</button>
      <app-workspace-screenshots (openTask)="openTask.emit($event)" />
    </div>
  </div>
}

@if (overlays.cliAdminOpen()) {
  <div class="overlay" data-testid="cli-admin-overlay" (click)="overlays.closeCliAdmin()" tabindex="0" (keydown.enter)="overlays.closeCliAdmin()" (keydown.space)="overlays.closeCliAdmin(); $event.preventDefault()">
    <div class="overlay__panel" (click)="$event.stopPropagation()" tabindex="0" (keydown.enter)="$event.stopPropagation()" (keydown.space)="$event.stopPropagation(); $event.preventDefault()">
      <button class="overlay__close" (click)="overlays.closeCliAdmin()" [appTooltip]="'Close'">×</button>
      @defer {
        <app-cli-admin-panel />
      }
    </div>
  </div>
}
