<!-- Review verdicts remain toasts; acute queue and integration alarms persist. -->
@if (breakerPauses().length > 0) {
  <app-notification
    kind="warning"
    layout="banner"
    ariaLive="polite"
    testid="runner-breaker-pause-banner">
    <strong data-testid="runner-breaker-headline">Pickup paused: infra breaker.</strong>
    <span class="notification__detail" data-testid="runner-breaker-detail">{{ breakerPauseSummary() }} Automatic breaker pauses resume after cooldown; manual pauses remain manual.</span>
  </app-notification>
}
<app-remote-queue-starvation-banner [projects]="projects()" />
<app-accepted-integration-alert-banner [projects]="projects()" />
