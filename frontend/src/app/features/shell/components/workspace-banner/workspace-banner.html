@if (displayed(); as msg) {
  <div class="banner"
       [class]="'banner--' + msg.topic"
       role="status"
       data-testid="workspace-banner">
    <span class="banner__icon" aria-hidden="true">{{ iconFor(msg.topic) }}</span>
    <div class="banner__body">
      <div class="banner__text" data-testid="workspace-banner-text">{{ headlineFor(msg) }}</div>
      <div class="banner__project" data-testid="workspace-banner-project">in {{ msg.project }}</div>
    </div>
    <button type="button"
            class="banner__close"
            aria-label="Dismiss"
            data-testid="workspace-banner-close"
            (click)="dismiss()">×</button>
  </div>
}
