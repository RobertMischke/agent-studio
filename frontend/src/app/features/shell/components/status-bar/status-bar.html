<div class="statusbar" data-testid="status-bar">
  <div class="statusbar__group statusbar__group--left">
    <app-statusbar-item
      [button]="false"
      bullet="●"
      [pulsing]="runningCount() > 0"
      [label]="runningCount() + ' running'"
      [tooltip]="runningTooltip()" />
    <app-statusbar-item
      [button]="false"
      icon="refresh"
      [iconSize]="11"
      [label]="autoCount() + '/' + projectCount() + ' auto'"
      [tooltip]="autoTooltip()" />

    <span class="statusbar__sep" aria-hidden="true"></span>

    <div class="statusbar__quota">
      <app-usage-hover-panel />
    </div>
  </div>

  <div class="statusbar__group statusbar__group--center statusbar__group--spacer"></div>

  <div class="statusbar__group statusbar__group--right">
    <app-statusbar-item icon="grid"     label="Usage"             tooltip="CLI sessions"
                        (activated)="toggleUsage.emit()" />
    <app-statusbar-item icon="bot"      label="Orchestrator"      tooltip="Orchestrator chat"
                        testid="orch-side-sheet-toggle"
                        (activated)="toggleOrchestrator.emit()" />
    <app-statusbar-item icon="activity" label="Feed"              tooltip="Orchestrator feed"
                        (activated)="toggleFeed.emit()" />
    <app-statusbar-item icon="eye"      label="Visual evidence"   tooltip="Workspace visual evidence (screenshots across projects)"
                        testid="status-bar-visual-evidence"
                        (activated)="toggleVisualEvidence.emit()" />
    <app-statusbar-item icon="settings" label="Manage CLIs"       tooltip="Manage CLIs (usage caps, admin)"
                        testid="status-bar-cli-admin"
                        (activated)="toggleCliAdmin.emit()" />

    <span class="statusbar__sep" aria-hidden="true"></span>

    <div class="statusbar__pickers">
      <button #cliPickerTrigger
              class="statusbar__item statusbar__item--btn"
              data-testid="status-bar-cli-picker"
              [appTooltip]="'Default CLI for new tasks: ' + cliLabel(defaultCli())"
              (click)="toggleCliMenu()">
        <span class="statusbar__icon">{{ cliIcon(defaultCli()) }}</span>
        <span>{{ cliLabel(defaultCli()) }}</span>
        <span class="statusbar__caret">▾</span>
      </button>

      <app-menu
        [items]="cliMenuItems()"
        [open]="cliMenuOpen()"
        [anchorEl]="cliPickerTrigger"
        placement="above"
        testIdPrefix="status-bar-cli-menu"
        ariaLabel="Default CLI picker"
        [minWidth]="200"
        (itemClick)="onCliMenuItemClick($event)"
        (closeRequest)="cliMenuOpen.set(false)" />
    </div>

    <div class="statusbar__pickers">
      <button #modelPickerTrigger
              class="statusbar__item statusbar__item--btn"
              data-testid="status-bar-model-picker"
              [appTooltip]="modelPickerTooltip()"
              (click)="toggleModelMenu()">
        <span class="statusbar__icon">⚙</span>
        <span>{{ defaultModelLabel() }}</span>
        <span class="statusbar__caret">▾</span>
      </button>

      <app-menu
        [items]="modelMenuItems()"
        [open]="modelMenuOpen()"
        [anchorEl]="modelPickerTrigger"
        placement="above"
        testIdPrefix="status-bar-model-menu"
        ariaLabel="Default model picker"
        [minWidth]="220"
        (itemClick)="onModelMenuItemClick($event)"
        (closeRequest)="modelMenuOpen.set(false)" />
    </div>
  </div>
</div>
