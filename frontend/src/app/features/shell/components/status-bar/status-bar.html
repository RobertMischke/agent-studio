<div class="statusbar" data-testid="status-bar">
  <div class="statusbar__group statusbar__group--left">
    <app-statusbar-item
      [button]="false"
      bullet="●"
      [pulsing]="runningCount() > 0"
      [label]="runningCount() + ' running'"
      [tooltip]="runningTooltip()" />
    <app-statusbar-item
      [button]="false"
      icon="refresh"
      [iconSize]="11"
      [label]="autoCount() + '/' + projectCount() + ' auto'"
      [tooltip]="autoTooltip()" />

    <span class="statusbar__sep" aria-hidden="true"></span>

    <div class="statusbar__quota">
      <app-usage-hover-panel (openCliAdmin)="openCliAdmin.emit()" />
    </div>
    @if (activeFallback(); as fallback) {
      <app-statusbar-item
        [button]="false"
        icon="warn"
        [label]="'fallback: ' + fallback.quotaFallbackModel"
        [tooltip]="'Quota fallback active: ' + fallback.quotaFallbackReason"
        testid="status-bar-quota-fallback" />
    }
  </div>

  <div class="statusbar__group statusbar__group--center statusbar__group--spacer"></div>

  <div class="statusbar__group statusbar__group--right">
    <app-statusbar-item icon="grid"     label="Usage"             tooltip="CLI usage: caps, sessions & token spend"
                        testid="status-bar-usage"
                        [active]="usageOpen()"
                        (activated)="toggleUsage.emit()" />
    <app-statusbar-item icon="bot"      label="Orchestrator"      tooltip="Orchestrator chat"
                        testid="orch-side-sheet-toggle"
                        [active]="orchestratorOpen()"
                        (activated)="toggleOrchestrator.emit()" />
    <app-statusbar-item icon="activity" label="Feed"              tooltip="Activity across all projects"
                        testid="status-bar-feed"
                        [active]="feedOpen()"
                        (activated)="toggleFeed.emit()" />
    <app-statusbar-item icon="settings" label="Settings"          tooltip="Workspace settings (CLI management, system prompts, token usage, visual evidence, summary)"
                        testid="status-bar-settings"
                        [active]="settingsOpen()"
                        (activated)="toggleSettings.emit()" />
    @if (showSignOut()) {
      <app-statusbar-item icon="close" label="Sign out" [tooltip]="'Sign out ' + signedInLabel()"
                          testid="status-bar-sign-out"
                          (activated)="signOut.emit()" />
    }

    <span class="statusbar__sep" aria-hidden="true"></span>

    <app-cli-model-selector
      class="statusbar__defaults"
      [cliType]="defaultCli()"
      [model]="defaultModel()"
      [thinkingLevel]="defaultThinkingLevel()"
      eyebrow="Defaults for new tasks"
      triggerTestid="status-bar-defaults"
      pickerTestidPrefix="status-bar-defaults-picker"
      (commit)="onDefaultCommit($event)" />
  </div>
</div>
