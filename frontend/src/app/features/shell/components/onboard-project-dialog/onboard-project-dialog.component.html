@if (manager.onboardProjectOpen()) {
  <app-dialog
    eyebrow="Project"
    title="New project"
    subtitle="The backend chooses the storage folder."
    kind="primary"
    testid="onboard-project-dialog"
    (closeRequest)="onCancel()"
    (backdropClick)="onCancel()">
    <div class="opd__form">
      <label class="opd__field">
        <span class="opd__label">Workspace</span>
        <select class="opd__input"
                data-testid="onboard-project-workspace"
                [ngModel]="workspaceId()"
                (ngModelChange)="workspaceId.set($event)">
          @for (ws of registryWorkspaces(); track ws.id) {
            <option [value]="ws.id">{{ ws.displayName }}</option>
          }
        </select>
      </label>
      <label class="opd__field">
        <span class="opd__label">Display Name</span>
        <input #nameInput class="opd__input" type="text"
               data-testid="onboard-project-display-name"
               [ngModel]="displayName()"
               (ngModelChange)="onNameChange($event)" />
      </label>
      <label class="opd__field">
        <span class="opd__label">Short Code</span>
        <input class="opd__input" type="text" maxlength="6"
               data-testid="onboard-project-short-code"
               [ngModel]="shortCode()"
               (ngModelChange)="onCodeChange($event)" />
      </label>
      <label class="opd__field">
        <span class="opd__label">Working directory (optional)</span>
        <input class="opd__input" type="text"
               placeholder="C:\Projects\my-repo"
               data-testid="onboard-project-root-path"
               [ngModel]="rootPath()"
               (ngModelChange)="rootPath.set($event)" />
        <span class="opd__hint">The CLI's working directory, if this project has a real checkout. Leave blank for a task-only project - auto-pickup stays off until this is set (here or later in Project Hub &rarr; Settings).</span>
      </label>
      <div class="opd__field">
        <span class="opd__label">CLI Default</span>
        <app-cli-model-selector
          [cliType]="cliDefault()"
          [model]="modelDefault()"
          [availableModels]="models()"
          eyebrow="Project default agent"
          triggerTestid="onboard-project-agent"
          pickerTestidPrefix="onboard-project-agent-picker"
          (commit)="onAgentCommit($event)" />
      </div>
      <div class="opd__field">
        <span class="opd__label">Color</span>
        <div class="opd__swatches" data-testid="onboard-project-color">
          @for (swatch of swatches; track swatch) {
            <button type="button"
                    class="opd__swatch"
                    [class.opd__swatch--selected]="color() === swatch"
                    [style.background]="swatch"
                    [attr.aria-label]="'Use color ' + swatch"
                    (click)="color.set(swatch)"></button>
          }
        </div>
      </div>
      <div class="opd__preview" data-testid="onboard-project-preview">
        Will create as {{ previewProjectId() }} in workspace "{{ currentWorkspaceName() }}".
      </div>
      @if (errorMsg(); as msg) {
        <p class="opd__error" data-testid="onboard-project-error">{{ msg }}</p>
      }
    </div>
    <div footer class="opd__actions">
      <button type="button" class="opd__btn" data-testid="onboard-project-cancel" (click)="onCancel()">Cancel</button>
      <button type="button" class="opd__btn opd__btn--primary" data-testid="onboard-project-submit" [disabled]="!canSubmit()" (click)="onSubmit()">
        {{ submitting() ? 'Creating...' : 'Create project' }}
      </button>
    </div>
  </app-dialog>
}
