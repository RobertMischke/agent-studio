@if (button()) {
  <button class="statusbar__item statusbar__item--btn"
          [class.statusbar__item--active]="active()"
          [attr.aria-pressed]="active()"
          [cacTooltip]="tooltip()"
          [attr.data-testid]="testid()"
          (click)="activated.emit($event)">
    @if (bullet(); as b) {
      <span class="statusbar__icon" [class.statusbar__icon--pulse]="pulsing()">{{ b }}</span>
    } @else if (icon(); as i) {
      <span class="statusbar__icon" [class.statusbar__icon--pulse]="pulsing()">
        <app-studio-icon [name]="i" [size]="iconSize()"></app-studio-icon>
      </span>
    }
    <span>{{ label() }}</span>
  </button>
} @else {
  <span class="statusbar__item statusbar__item--ro"
        [cacTooltip]="tooltip()"
        [attr.data-testid]="testid()">
    @if (bullet(); as b) {
      <span class="statusbar__icon" [class.statusbar__icon--pulse]="pulsing()">{{ b }}</span>
    } @else if (icon(); as i) {
      <span class="statusbar__icon" [class.statusbar__icon--pulse]="pulsing()">
        <app-studio-icon [name]="i" [size]="iconSize()"></app-studio-icon>
      </span>
    }
    <span>{{ label() }}</span>
  </span>
}
