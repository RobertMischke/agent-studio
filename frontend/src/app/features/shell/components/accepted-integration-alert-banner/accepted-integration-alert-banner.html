@if (visibleItems().length > 0) {
  <app-notification
    kind="warning"
    layout="banner"
    ariaLive="polite"
    testid="accepted-integration-alert-banner">
    <strong data-testid="notice-bar-headline"><span class="notification__number">{{ visibleItems().length }}</span> accepted {{ visibleItems().length === 1 ? 'task has' : 'tasks have' }} not reached successful integration for over <span class="notification__number">{{ thresholdMinutes() }}</span> minutes.</strong>
    <span class="notification__detail" data-testid="notice-bar-detail">{{ projectTaskKeys() }}. Open a task to inspect its integration outcome.</span>
  </app-notification>
}
