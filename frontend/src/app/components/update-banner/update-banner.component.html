@switch (mode()) {
  @case ('done') {
    <div class="update-banner update-banner--done" data-testid="update-banner-done" role="status" aria-live="polite">
      <span class="update-banner__text">
        Updated to <strong>{{ status()!.headLocal }}</strong> ({{ status()!.message }}).
      </span>
      <button type="button" class="update-banner__btn" data-testid="update-banner-dismiss" (click)="dismiss()">Dismiss</button>
    </div>
  }
  @case ('failed') {
    <div class="update-banner update-banner--failed" data-testid="update-banner-failed" role="alert">
      <span class="update-banner__text">
        Update failed: {{ status()?.message }}
      </span>
      <button type="button" class="update-banner__btn" (click)="dismiss()">Dismiss</button>
    </div>
  }
}
