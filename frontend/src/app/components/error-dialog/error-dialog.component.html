<app-dialog eyebrow="Error details"
            [title]="error().title"
            role="alertdialog"
            kind="danger"
            testid="error-dialog"
            (close)="close.emit()"
            (backdropClick)="close.emit()">
  @if (error().source) {
    <div class="error-dialog__source">{{ error().source }}</div>
  }

  <div class="error-dialog__message" data-testid="error-dialog-message">{{ error().message }}</div>

  <div class="error-dialog__actions">
    <button class="btn" type="button" (click)="copy.emit()">{{ copyButtonLabel() }}</button>
    @if (canOpenCliConfig()) {
      <button class="btn btn--primary" type="button" (click)="openCliConfig.emit()">🔧 Configure CLI</button>
    }
  </div>

  <section class="error-dialog__section">
    <div class="error-dialog__section-title">Output</div>
    <pre class="error-dialog__code">{{ error().output }}</pre>
  </section>

  <section class="error-dialog__section">
    <div class="error-dialog__section-title">Stack trace</div>
    @if (error().stackTrace) {
      <pre class="error-dialog__code">{{ error().stackTrace }}</pre>
    } @else {
      <div class="error-dialog__empty">No stack trace available for this error.</div>
    }
  </section>
</app-dialog>
