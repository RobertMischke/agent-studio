@if (collapsible()) {
  <button type="button"
          class="section-header section-header--btn section-header--collapsible"
          [class.section-header--active]="active()"
          [class.section-header--collapsed]="collapsed()"
          [attr.data-testid]="testid()"
          [attr.aria-expanded]="!collapsed()"
          (click)="onCollapseToggle($event)">
    <span class="section-header__chev" aria-hidden="true">
      <app-studio-icon
        [name]="collapsed() ? 'chevronRight' : 'chevronDown'"
        [size]="10"></app-studio-icon>
    </span>
    @if (icon(); as i) {
      <span class="section-header__icon" aria-hidden="true">
        <app-studio-icon [name]="i" [size]="12"></app-studio-icon>
      </span>
    } @else if (iconChar(); as c) {
      <span class="section-header__icon-char" aria-hidden="true">{{ c }}</span>
    }
    <span class="section-header__title">{{ title() }}</span>
    @if (count() !== null) {
      <span class="section-header__count">{{ count() }}</span>
    }
    <ng-content select="[actions]"></ng-content>
  </button>
} @else if (interactive()) {
  <button type="button"
          class="section-header section-header--btn"
          [class.section-header--active]="active()"
          [attr.data-testid]="testid()">
    @if (icon(); as i) {
      <span class="section-header__icon" aria-hidden="true">
        <app-studio-icon [name]="i" [size]="12"></app-studio-icon>
      </span>
    } @else if (iconChar(); as c) {
      <span class="section-header__icon-char" aria-hidden="true">{{ c }}</span>
    }
    <span class="section-header__title">{{ title() }}</span>
    @if (count() !== null) {
      <span class="section-header__count">{{ count() }}</span>
    }
    <ng-content select="[actions]"></ng-content>
  </button>
} @else {
  <header class="section-header"
          [class.section-header--active]="active()"
          [attr.data-testid]="testid()">
    @if (icon(); as i) {
      <span class="section-header__icon" aria-hidden="true">
        <app-studio-icon [name]="i" [size]="12"></app-studio-icon>
      </span>
    } @else if (iconChar(); as c) {
      <span class="section-header__icon-char" aria-hidden="true">{{ c }}</span>
    }
    <h2 class="section-header__title">{{ title() }}</h2>
    @if (count() !== null) {
      <span class="section-header__count">{{ count() }}</span>
    }
    <ng-content select="[actions]"></ng-content>
  </header>
}
