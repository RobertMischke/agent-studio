<div class="app-row" data-testid="app-row">
  <span class="app-row__label" data-testid="app-row-label">
    <ng-content select="[appRowLabel]"></ng-content>
  </span>
  <span class="app-row__value" data-testid="app-row-value">
    <ng-content select="[appRowValue]"></ng-content>
  </span>
  <span class="app-row__trailing" data-testid="app-row-trailing">
    <ng-content select="[appRowTrailing]"></ng-content>
  </span>
</div>
