@if (lightbox.active(); as media) {
  <div class="media-lightbox"
       appOverlayPortal="modal"
       role="dialog"
       aria-modal="true"
       aria-label="Image preview"
       data-testid="media-lightbox"
       tabindex="-1"
       (click)="close()" (keydown.enter)="close()" (keydown.space)="close(); $event.preventDefault()">
    <button type="button"
            class="media-lightbox__close"
            data-testid="media-lightbox-close"
            aria-label="Close"
            (click)="close(); $event.stopPropagation()">×</button>

    @if (lightbox.count() > 1) {
      <button type="button"
              class="media-lightbox__nav media-lightbox__nav--prev"
              data-testid="media-lightbox-prev"
              aria-label="Previous image"
              [disabled]="!lightbox.hasPrev()"
              (click)="prev(); $event.stopPropagation()"
              (keydown.enter)="prev(); $event.stopPropagation(); $event.preventDefault()"
              (keydown.space)="prev(); $event.stopPropagation(); $event.preventDefault()">‹</button>
      <button type="button"
              class="media-lightbox__nav media-lightbox__nav--next"
              data-testid="media-lightbox-next"
              aria-label="Next image"
              [disabled]="!lightbox.hasNext()"
              (click)="next(); $event.stopPropagation()"
              (keydown.enter)="next(); $event.stopPropagation(); $event.preventDefault()"
              (keydown.space)="next(); $event.stopPropagation(); $event.preventDefault()">›</button>
    }

    <figure class="media-lightbox__figure"
            (click)="$event.stopPropagation()" tabindex="0" (keydown.enter)="$event.stopPropagation()" (keydown.space)="$event.stopPropagation(); $event.preventDefault()">
      <div class="media-lightbox__stage"
           [class.media-lightbox__stage--zoomed]="zoomed()"
           data-testid="media-lightbox-stage">
        <img class="media-lightbox__img"
             [class.media-lightbox__img--zoomed]="zoomed()"
             data-testid="media-lightbox-image"
             [src]="media.src"
             [alt]="media.alt"
             [cacTooltip]="zoomed() ? 'Fit image to viewer' : 'Show original size'"
             role="button"
             tabindex="0"
             (click)="toggleZoom($event)"
             (keydown.enter)="toggleZoom($event)"
             (keydown.space)="toggleZoom($event); $event.preventDefault()" />
      </div>
      @if (media.alt) {
        <figcaption class="media-lightbox__caption"
                    data-testid="media-lightbox-caption">{{ media.alt }}</figcaption>
      }
      @if (media.actions.length > 0) {
        <div class="media-lightbox__actions" data-testid="media-lightbox-actions">
          @for (action of media.actions; track action.id) {
            <button type="button"
                    class="media-lightbox__action"
                    [attr.data-testid]="'media-lightbox-action-' + action.id"
                    [cacTooltip]="action.tooltip"
                    (click)="runAction(action); $event.stopPropagation()">
              {{ action.label }}
            </button>
          }
        </div>
      }
    </figure>

    <div class="media-lightbox__hint"
         data-testid="media-lightbox-hint"
         (pointerdown)="$event.stopPropagation()">
      @if (lightbox.count() > 1) {
        <span class="media-lightbox__hint-pos" data-testid="media-lightbox-position"
          >Bild {{ lightbox.position() }} / {{ lightbox.count() }}</span>
        <span class="media-lightbox__hint-sep" aria-hidden="true">·</span>
        <span class="media-lightbox__hint-keys"><kbd>←</kbd> <kbd>→</kbd> blättern</span>
        <span class="media-lightbox__hint-sep" aria-hidden="true">·</span>
      }
      <span class="media-lightbox__hint-keys"><kbd>Esc</kbd> schließen</span>
    </div>
  </div>
}
