<div class="overlay">
  <div class="create-dialog"
       role="dialog"
       aria-modal="true"
       [class.create-dialog--drag]="isDragging()"
       (dragover)="onDragOver($event)"
       (dragleave)="onDragLeave($event)"
       (drop)="onDrop($event)">
    <button type="button"
            class="create-dialog__close"
            data-testid="create-dialog-close"
            aria-label="Close"
            title="Close"
            (click)="cancel.emit()">×</button>
    <h2 class="create-dialog__title">{{ title() }}</h2>
    <label class="field">
      <span class="field__label">Title</span>
      <input class="field__input" [(ngModel)]="newTitle" placeholder="Task title" />
    </label>
    <label class="field">
      <span class="field__label">Project</span>
      <select class="field__input" data-testid="create-project-select" [(ngModel)]="newWatchPath">
        @for (wp of watchPaths(); track wp.path) {
          <option [value]="wp.path">{{ wp.name }}</option>
        }
      </select>
    </label>
    <div class="field">
      <span class="field__label">Agent</span>
      <div class="create-cli-picker">
        @for (t of cliTypes; track t) {
          <button type="button"
                  class="create-cli-picker__btn"
                  [class.create-cli-picker__btn--active]="cliTypeDraft() === t"
                  (click)="cliTypeChange.emit(t)">
            <span class="create-cli-picker__icon" aria-hidden="true">{{ cliTypeIcon(t) }}</span>
            {{ cliTypeLabel(t) }}
          </button>
        }
      </div>
    </div>
    <div class="field">
      <span class="field__label">Model</span>
      <select class="field__input" [(ngModel)]="newModel">
        <option value="">(default — CLI chooses)</option>
        @for (m of availableModels(); track m.id) {
          <option [value]="m.id">{{ m.label }}{{ m.multiplier !== null && m.multiplier !== undefined ? ' — ' + formatMultiplier(m.multiplier) : '' }}{{ m.isDefault ? ' ✓' : '' }}</option>
        }
      </select>
    </div>
    <div class="field">
      <div class="create-dialog__prompt-label">
        <span class="field__label">Prompt (optional)</span>
        <button type="button"
                class="create-dialog__attach-btn"
                data-testid="create-attach-image"
                (click)="triggerFilePicker()"
                title="Attach image (paste or drop also works)">📎 Image</button>
      </div>
      <textarea #promptArea
                class="field__input field__textarea"
                data-testid="create-prompt"
                [(ngModel)]="newPrompt"
                (paste)="onPromptPaste($event)"
                rows="10"
                placeholder="Task description..."></textarea>
      @if (hasAttachments()) {
        <div class="create-dialog__attachments" data-testid="create-attachments">
          @for (att of attachments(); track att.id) {
            <div class="create-dialog__attachment">
              <img [src]="att.previewUrl" [alt]="att.alt" />
              <span class="create-dialog__attachment-name">{{ att.file.name || att.alt }}</span>
              <button type="button"
                      class="create-dialog__attachment-remove"
                      (click)="removeAttachment(att.id)"
                      title="Remove attachment">×</button>
            </div>
          }
        </div>
      }
      @if (attachmentError()) {
        <div class="create-dialog__attachment-error" data-testid="create-attach-error">⚠ {{ attachmentError() }}</div>
      }
    </div>
    <div class="create-dialog__actions">
      <button class="btn" (click)="cancel.emit()">Cancel</button>
      <button class="btn btn--primary" (click)="submit.emit()" [disabled]="!newTitle().trim()">Create</button>
    </div>
    <input #fileInput
           type="file"
           accept="image/png,image/jpeg,image/gif,image/webp"
           class="create-dialog__file"
           data-testid="create-attach-input"
           multiple
           (change)="onFileInputChange($event)" />
  </div>
</div>
