<div class="header__filters">
  @for (name of names(); track name) {
    <div class="project-tab">
      <button class="filter-chip"
              [attr.data-testid]="'project-filter-' + name"
              [class.filter-chip--active]="isActive()(name)"
              [style.--project-color]="identityFor(name).color"
              [style.--project-border]="identityFor(name).border"
              [style.--project-soft]="identityFor(name).soft"
              [style.--project-on]="identityFor(name).onColor"
              (click)="toggle.emit(name)">
        <span class="filter-chip__disk" aria-hidden="true">{{ identityFor(name).initial }}</span>
        @if (runnerIndicator()(name); as indicator) {
          <span class="runner-dot" [class]="'runner-dot--' + indicator.cls">{{ indicator.icon }}</span>
        }
        {{ name }}
      </button>
      @if (autoInfo()(name); as info) {
        <button class="auto-toggle"
                [attr.data-testid]="'auto-toggle-' + name"
                [class.auto-toggle--on]="info.state === 'on'"
                [class.auto-toggle--stopping]="info.state === 'stopping'"
                [title]="info.tooltip"
                (click)="toggleAuto.emit(name)">
          <span class="auto-toggle__icon">{{ info.icon }}</span>
          <span class="auto-toggle__label">{{ info.label }}</span>
          @if (info.readyCount > 0) {
            <span class="auto-toggle__count" [attr.data-testid]="'auto-count-' + name">{{ info.readyCount }}</span>
          }
        </button>
      }
    </div>
  }
</div>
