<div class="dialog__overlay"
     [attr.data-testid]="testid() ? testid() + '-overlay' : null"
     (click)="onBackdropClick()" tabindex="0" (keydown.enter)="onBackdropClick()" (keydown.space)="onBackdropClick(); $event.preventDefault()">
  <div class="dialog"
       [class.dialog--danger]="kind() === 'danger'"
       [class.dialog--primary]="kind() === 'primary'"
       [class.dialog--sm]="size() === 'sm'"
       [style.width.px]="width()"
       [attr.role]="role()"
       aria-modal="true"
       [attr.aria-label]="title()"
       [attr.data-testid]="testid()"
       tabindex="-1"
       (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()" (keydown.space)="$event.stopPropagation(); $event.preventDefault()">
    <header class="dialog__header">
      <div class="dialog__title-block">
        @if (eyebrow(); as e) {
          <span class="dialog__eyebrow">{{ e }}</span>
        }
        <h2 class="dialog__title">{{ title() }}</h2>
        @if (subtitle(); as s) {
          <span class="dialog__subtitle">{{ s }}</span>
        }
      </div>
      @if (closable()) {
        <button type="button"
                class="dialog__close"
                aria-label="Close"
                [attr.data-testid]="testid() ? testid() + '-close' : null"
                (click)="closeRequest.emit()">
          <app-studio-icon name="close" [size]="14"></app-studio-icon>
        </button>
      }
    </header>
    <div class="dialog__body">
      <ng-content></ng-content>
    </div>
    <footer class="dialog__footer">
      <ng-content select="[footer]"></ng-content>
    </footer>
  </div>
</div>
