<div class="app-notify-stack" data-testid="notification-stack">
  @for (n of notifications(); track n.id) {
    <app-notification
      class="app-notify"
      [kind]="n.kind"
      layout="toast"
      [title]="n.title ?? null"
      [closable]="true"
      [testid]="'notification-' + n.kind"
      (closeRequest)="dismiss(n.id)">
      <span data-testid="notification-message">{{ n.message }}</span>
      @if (n.source) {
        <div class="app-notify__source" notification-source data-testid="notification-source">{{ n.source }}</div>
      }
    </app-notification>
  }
</div>
<!--
  Full-width update strip mounts alongside the toast stack so both
  surfaces share the same "notifications area" instead of having
  app.html hardcode the update banner separately. The component reads
  UpdateClientService.status directly; this container only positions it.
-->
<app-update-banner />
