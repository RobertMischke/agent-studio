@if (collapsible()) {
  <!-- Collapsible section mode — the shared sidebar/explorer panel header
       (absorbed from the former app-section-header). The whole row is the
       collapse toggle; `aria-expanded` + the `studio-explorer-*` testids
       are the contract the F27/F46 explorer specs assert on. -->
  <button type="button"
          class="section-header section-header--btn section-header--collapsible"
          [class.section-header--collapsed]="collapsed()"
          [attr.data-testid]="testid()"
          [attr.aria-expanded]="!collapsed()"
          (click)="onCollapseToggle($event)">
    <span class="section-header__chev" aria-hidden="true">
      <app-studio-icon
        [name]="collapsed() ? 'chevronRight' : 'chevronDown'"
        [size]="10"></app-studio-icon>
    </span>
    @if (icon(); as i) {
      <span class="section-header__icon" aria-hidden="true">
        <app-studio-icon [name]="i" [size]="12"></app-studio-icon>
      </span>
    }
    <span class="section-header__title">{{ title() }}</span>
    @if (count() !== null) {
      <span class="section-header__count">{{ count() }}</span>
    }
    <ng-content select="[actions]"></ng-content>
  </button>
} @else {
<header class="pane-header"
        [class]="modifier() ? 'pane-header pane-header--' + modifier() : 'pane-header'"
        [attr.data-testid]="testid()">
  <!-- Tab strip slot: when present, replaces the icon+title block. -->
  <ng-content select="[tabs]"></ng-content>

  @if (title(); as t) {
    <div class="pane-header__title-block">
      @if (iconEmoji(); as ie) {
        <span class="pane-header__icon-emoji" aria-hidden="true">{{ ie }}</span>
      } @else if (icon(); as i) {
        <app-studio-icon class="pane-header__icon" [name]="i" [size]="13"></app-studio-icon>
      }
      <span class="pane-header__title">{{ t }}</span>
      @if (subtitle(); as s) {
        <span class="pane-header__subtitle">{{ s }}</span>
      }
    </div>
  }

  <ng-content select="[actions]"></ng-content>

  <span class="pane-header__spacer"></span>

  <ng-content select="[trailing]"></ng-content>

  @if (maximizable()) {
    <button type="button"
            class="pane-header__btn"
            data-testid="pane-header-maximize"
            [attr.aria-label]="maximized() ? 'Restore' : 'Maximize'"
            (click)="maximize.emit()">
      <app-studio-icon [name]="maximized() ? 'collapse' : 'expand'" [size]="12"></app-studio-icon>
    </button>
  }
  @if (hideable()) {
    <button type="button"
            class="pane-header__btn"
            data-testid="pane-header-hide"
            aria-label="Hide panel"
            (click)="hide.emit()">
      <app-studio-icon name="close" [size]="12"></app-studio-icon>
    </button>
  }
</header>
}
