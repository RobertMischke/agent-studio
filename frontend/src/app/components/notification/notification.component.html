<div class="notification"
     [class]="'notification--' + kind() + ' notification--layout-' + layout()"
     role="status"
     [attr.aria-live]="resolvedAriaLive()"
     [attr.data-testid]="testid()">
  <span class="notification__icon" aria-hidden="true" data-testid="notification-icon">{{ resolvedIcon() }}</span>
  <div class="notification__body">
    @if (title(); as t) {
      <div class="notification__title" data-testid="notification-title">{{ t }}</div>
    }
    <div class="notification__message">
      <ng-content></ng-content>
    </div>
    <ng-content select="[notification-source]"></ng-content>
    <ng-content select="[notification-actions]"></ng-content>
  </div>
  @if (closable()) {
    <button type="button"
            class="notification__close"
            aria-label="Dismiss"
            data-testid="notification-close"
            (click)="closeRequest.emit()">×</button>
  }
</div>
