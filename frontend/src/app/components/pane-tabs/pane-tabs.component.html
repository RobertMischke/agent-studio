<div [class]="containerClass()"
     role="tablist"
     [attr.aria-label]="ariaLabel()"
     [style.--pane-tab-min-width.px]="minimumTabWidth()">
  @for (tab of inlineTabs(); track trackTab($index, tab)) {
    <button type="button"
            [ngClass]="tabClass(tab)"
            role="tab"
            [disabled]="tab.disabled === true"
            [attr.aria-selected]="tab.id === activeTabId()"
            [attr.data-testid]="tab.testid ?? null"
            (click)="onClick(tab)">
      @if (tab.icon) {
        <app-studio-icon class="pane-tab__icon" [name]="tab.icon" [size]="12"></app-studio-icon>
      } @else if (tab.emoji) {
        <span class="pane-tab__emoji" aria-hidden="true">{{ tab.emoji }}</span>
      }
      <span class="pane-tab__label">{{ tab.label }}</span>
      @if (tab.badge !== null && tab.badge !== undefined && tab.badge !== '' && tab.badge !== 0) {
        <app-count-badge class="pane-tab__badge"
                         [value]="tab.badge"
                         [tone]="tab.id === activeTabId() ? 'active' : 'default'"
                         variant="pane-tab"
                         [attr.data-testid]="tab.testid ? tab.testid + '-badge' : null" />
      }
      @if (tab.indicator === 'spinner') {
        <span class="pane-tab__spinner" aria-hidden="true"></span>
      } @else if (tab.indicator === 'live') {
        <span class="pane-tab__livedot" aria-hidden="true"></span>
      }
    </button>
  }
  @if (overflowTabs().length > 0) {
    <button type="button"
            class="pane-tab pane-tab--overflow"
            data-testid="pane-tabs-overflow"
            [attr.aria-label]="overflowAriaLabel()"
            aria-haspopup="menu"
            [attr.aria-expanded]="overflowOpen()"
            (click)="toggleOverflow($event)">
      <span aria-hidden="true">⋯</span>
      @if (overflowBadgeTotal(); as badgeTotal) {
        <app-count-badge class="pane-tab__overflow-badge"
                         [value]="badgeTotal"
                         tone="default"
                         variant="pane-tab"
                         data-testid="pane-tabs-overflow-badge" />
      }
    </button>
  }
</div>
<app-menu
  [items]="overflowMenuItems()"
  [open]="overflowOpen()"
  [anchorEl]="overflowAnchor()"
  placement="below"
  testIdPrefix="pane-tabs-overflow"
  ariaLabel="More tabs"
  [minWidth]="160"
  (itemClick)="onOverflowItemClick($event)"
  (closeRequest)="closeOverflow()" />
