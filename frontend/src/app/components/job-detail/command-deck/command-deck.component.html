<div class="commandbar"
     [class.commandbar--collapsed]="collapsed()"
     data-testid="commandbar">
  @if (collapsed()) {
    <span class="commandbar__status" data-testid="commandbar-running">
      <span class="commandbar__pulse"></span>
      <span class="commandbar__status-text">Running · {{ elapsedTime() }}</span>
    </span>
    <span class="commandbar__compact-meta">
      <span class="commandbar__chip">{{ cliTypeLabel(cliTypeDraft()) }}</span>
      @if (modelDraft(); as m) {
        <span class="commandbar__chip commandbar__chip--muted">{{ m }}</span>
      }
    </span>
    <span class="commandbar__spacer"></span>
    <button type="button"
            class="commandbar__toggle"
            data-testid="commandbar-show-setup"
            (click)="toggleCollapsed.emit()">
      Show setup
    </button>
    <button class="btn-exec btn-exec--stop commandbar__action" (click)="stop.emit()">⏹ Stop</button>
  } @else {
    <label class="commandbar__field commandbar__field--project">
      <span class="commandbar__label">Project</span>
      <select class="commandbar__select"
              [ngModel]="currentWatchPath()"
              (ngModelChange)="projectChange.emit($event)">
        @for (wp of watchPaths(); track wp.path) {
          <option [value]="wp.path">{{ wp.name }}</option>
        }
      </select>
    </label>

    <div class="commandbar__cli" role="tablist" [attr.aria-label]="'CLI'">
      @for (t of cliTypes; track t) {
        <button type="button"
                class="commandbar__cli-btn"
                [class.commandbar__cli-btn--active]="cliTypeDraft() === t"
                [disabled]="isRunning()"
                (click)="cliTypeChange.emit(t)">
          <span class="commandbar__cli-icon" aria-hidden="true">{{ cliTypeIcon(t) }}</span>
          {{ cliTypeLabel(t) }}
        </button>
      }
    </div>

    <label class="commandbar__field commandbar__field--grow">
      <span class="commandbar__label">Model</span>
      <select id="job-model"
              class="commandbar__select"
              [ngModel]="modelDraft()"
              [disabled]="isRunning()"
              (ngModelChange)="modelChange.emit($event)">
        <option value="">(default)</option>
        @for (m of availableModels(); track m.id) {
          <option [value]="m.id">{{ m.label }}{{ m.multiplier !== null && m.multiplier !== undefined ? ' — ' + formatMultiplier(m.multiplier) : '' }}{{ m.isDefault ? ' ✓' : '' }}</option>
        }
      </select>
    </label>

    @if (isRunning()) {
      <span class="commandbar__status" data-testid="commandbar-running">
        <span class="commandbar__pulse"></span>
        <span class="commandbar__status-text">{{ elapsedTime() }}</span>
      </span>
      <button type="button"
              class="commandbar__toggle"
              data-testid="commandbar-hide-setup"
              (click)="toggleCollapsed.emit()">
        Hide setup
      </button>
      <button class="btn-exec btn-exec--stop commandbar__action" (click)="stop.emit()">⏹ Stop</button>
    } @else if (canStart()) {
      <button class="btn-exec btn-exec--start commandbar__action" (click)="start.emit()" [disabled]="starting()">
        {{ starting() ? '⏳' : '▶ Start' }}
      </button>
    }
  }
</div>
