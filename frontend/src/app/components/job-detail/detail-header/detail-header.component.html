<header class="detail__header">
  <div class="detail__header-main">
    <button class="detail__back" (click)="back.emit()">←</button>
    <div class="detail__headline">
      @if (editingTitle()) {
        <div class="detail__title-edit">
          <input #titleInput
                 class="detail__title-input"
                 type="text"
                 [value]="titleDraft()"
                 (input)="titleDraftChange.emit($any($event.target).value)"
                 (keydown.enter)="saveTitle.emit()"
                 (keydown.escape)="cancelTitleEdit.emit()"
                 maxlength="200"
                 placeholder="Task title" />
          <div class="detail__title-actions">
            <button type="button"
                    class="btn-sm btn-sm--primary"
                    [disabled]="savingTitle() || !titleDraft().trim() || titleDraft().trim() === (info().title || info().id)"
                    (click)="saveTitle.emit()">Save</button>
            <button type="button"
                    class="btn-sm"
                    [disabled]="savingTitle()"
                    (click)="cancelTitleEdit.emit()">Cancel</button>
          </div>
        </div>
      } @else {
        <div class="detail__project"
             data-testid="detail-project"
             [style.--project-color]="identity().color"
             [style.--project-border]="identity().border"
             [style.--project-soft]="identity().soft"
             [style.--project-on]="identity().onColor">
          <span class="detail__project-disk" aria-hidden="true">{{ identity().initial }}</span>
          <span class="detail__project-name">{{ info().projectName }}</span>
        </div>
        <h2 class="detail__title"
            (click)="startTitleEdit.emit()"
            title="Click to rename">
          {{ info().title || info().id }}
          <button type="button"
                  class="detail__title-edit-btn"
                  (click)="$event.stopPropagation(); startTitleEdit.emit()"
                  aria-label="Rename task">✎</button>
        </h2>
        <div class="detail__meta">
          <span class="detail__meta-item"
                data-testid="detail-created-at"
                [title]="createdAtTooltip()">⏱ erstellt {{ relativeCreated() }}</span>
        </div>
      }
    </div>
  </div>
  <span class="detail__state" [class]="'state--' + info().state">
    {{ stateLabel(info().state) }}
  </span>
  @if (isReview()) {
    <button type="button"
            class="detail__complete-next"
            data-testid="complete-and-next-btn"
            [disabled]="completingAndNext()"
            (click)="completeAndNext.emit()">
      {{ completingAndNext() ? '⏳' : '✓ Complete & Next' }}
    </button>
  }
</header>
