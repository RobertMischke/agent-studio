<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e3a"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Kanban board: 3 bold columns -->
  <rect x="72" y="100" width="108" height="312" rx="20" fill="url(#board)" opacity="0.3"/>
  <rect x="202" y="100" width="108" height="312" rx="20" fill="url(#board)" opacity="0.3"/>
  <rect x="332" y="100" width="108" height="312" rx="20" fill="url(#board)" opacity="0.3"/>
  <!-- Cards in columns -->
  <rect x="88" y="128" width="76" height="52" rx="12" fill="#818cf8"/>
  <rect x="88" y="196" width="76" height="52" rx="12" fill="#818cf8" opacity="0.6"/>
  <rect x="218" y="128" width="76" height="52" rx="12" fill="#38bdf8"/>
  <rect x="218" y="196" width="76" height="72" rx="12" fill="#38bdf8" opacity="0.6"/>
  <rect x="348" y="128" width="76" height="52" rx="12" fill="#34d399"/>
  <!-- Check mark on completed card -->
  <polyline points="366,150 380,164 400,140" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
